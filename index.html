<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UroOppslag">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16283C">
<title>UroOppslag — Klinisk oppslagsverk for LIS i urologi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4EF;
    --paper-dim:#ECEAE2;
    --card:#FFFFFF;
    --ink:#1C2430;
    --ink-soft:#5B6472;
    --line:#DAD5C8;
    --line-strong:#C7C1B2;
    --steel:#2C4A6E;
    --steel-deep:#16283C;
    --steel-tint:#E8EEF4;
    --amber:#A9711F;
    --amber-tint:#F5EAD7;
    --low:#3C7A5C;
    --low-tint:#E3F0E9;
    --mid:#A9741F;
    --mid-tint:#F6EEDA;
    --high:#A8453B;
    --high-tint:#F5E3E1;
    --internal:#6B4E8C;
    --internal-tint:#EFE9F5;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
    --display:'Space Grotesk', system-ui, sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--steel);}
  ::selection{background:var(--amber-tint);}

  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:16px;
    height:56px; padding:0 16px;
    background:var(--steel-deep);
    color:#EDEFF2;
    border-bottom:1px solid var(--steel-deep);
  }
  .topbar .brand{
    display:flex; align-items:baseline; gap:8px;
    font-family:var(--display); font-weight:700; font-size:17px;
    letter-spacing:.2px; color:#fff; white-space:nowrap;
  }
  .topbar .brand .sub{
    font-family:var(--mono); font-weight:400; font-size:11px;
    color:#9FB0C4; letter-spacing:.3px;
  }
  .hamburger{
    display:none; background:none; border:none; color:#fff;
    font-size:20px; cursor:pointer; padding:4px 8px;
  }
  .searchwrap{flex:1; max-width:420px; margin-left:auto; position:relative;}
  .searchwrap input{
    width:100%; padding:9px 12px 9px 32px; border-radius:20px; border:1px solid #33475F;
    background:#1F344A; color:#EDEFF2; font-family:var(--sans); font-size:16px;
    outline:none;
  }
  .searchwrap input::placeholder{color:#8FA1B7;}
  .searchwrap input:focus{border-color:var(--amber);}
  .searchwrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.6;}
  .search-results{
    position:absolute; top:38px; left:0; right:0; background:#fff; color:var(--ink);
    border:1px solid var(--line-strong); border-radius:6px; max-height:340px; overflow:auto;
    box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; z-index:60;
  }
  .search-results.show{display:block;}
  .search-results a{
    display:block; padding:9px 14px; font-size:13.5px; color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--paper-dim);
  }
  .search-results a:hover{background:var(--steel-tint);}
  .search-results .cat{color:var(--ink-soft); font-size:11px; font-family:var(--mono);}

  .shell{display:flex; min-height:calc(100vh - 56px);}
  .sidebar{
    width:280px; flex-shrink:0; background:var(--paper-dim);
    border-right:1px solid var(--line); padding:18px 0 60px;
    position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  }
  .sidebar h3.groupname{
    font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink-soft); margin:22px 18px 8px; display:flex; align-items:center; gap:6px;
  }
  .sidebar h3.groupname:first-child{margin-top:0;}
  .swatch{width:9px; height:9px; border-radius:2px; display:inline-block;}
  .sw-benign{background:var(--steel);}
  .sw-malign{background:var(--high);}
  .sw-kirurgi{background:var(--amber);}
  .sw-admin{background:var(--internal);}
  .sw-akutt{background:#C4451F;}
  .navlist{list-style:none; margin:0; padding:0;}
  .navlist li a{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 18px; font-size:13.5px; color:var(--ink); text-decoration:none;
    border-left:3px solid transparent;
  }
  .navlist li a:hover{background:var(--steel-tint);}
  .navlist li a.active{
    background:var(--steel-tint); border-left-color:var(--steel); font-weight:600;
  }
  .navlist li a.disabled{color:#A6A196; cursor:default; pointer-events:none;}
  .pill{
    font-family:var(--mono); font-size:9.5px; padding:1px 6px; border-radius:10px;
    background:var(--paper-dim); color:var(--ink-soft); border:1px solid var(--line);
    white-space:nowrap;
  }

  .main{flex:1; min-width:0; padding:36px 40px 100px; max-width:900px;}

  .crumb{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .crumb a{color:var(--ink-soft); text-decoration:none;}
  .crumb a:hover{text-decoration:underline;}
  h1.pagetitle{
    font-family:var(--display); font-size:32px; font-weight:700; margin:0 0 6px; color:var(--steel-deep);
    letter-spacing:-.2px;
  }
  .tagrow{display:flex; gap:8px; align-items:center; margin-bottom:26px; flex-wrap:wrap;}
  .tag{
    font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:20px; letter-spacing:.2px;
  }
  .tag-benign{background:var(--steel-tint); color:var(--steel);}
  .tag-malign{background:var(--high-tint); color:var(--high);}
  .tag-kirurgi{background:var(--amber-tint); color:var(--amber);}
  .tag-akutt{background:#F5E1D8; color:#C4451F;}

  .content h2{
    font-family:var(--display); font-size:19px; font-weight:700; color:var(--steel-deep);
    margin:34px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .content h3{font-family:var(--sans); font-size:15px; font-weight:600; margin:20px 0 8px; color:var(--ink);}
  .content p{margin:0 0 12px; font-size:14.5px;}
  .content ul, .content ol{margin:0 0 14px; padding-left:22px; font-size:14.5px;}
  .content li{margin-bottom:5px;}
  .content strong{color:var(--steel-deep);}

  .callout{
    border-left:3px solid var(--steel); background:var(--steel-tint); padding:12px 16px;
    border-radius:0 4px 4px 0; margin:16px 0; font-size:13.8px;
  }
  .callout.amber{border-color:var(--amber); background:var(--amber-tint);}
  .callout.high{border-color:var(--high); background:var(--high-tint);}
  .callout.internal{border-color:var(--internal); background:var(--internal-tint);}
  .callout b{display:block; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.6px; margin-bottom:4px; color:inherit;}
  .tag-internal{background:var(--internal-tint); color:var(--internal);}
  .tag-code{background:var(--paper-dim); color:var(--ink-soft); border:1px solid var(--line-strong);}

  table.datatable{width:100%; border-collapse:collapse; margin:14px 0 20px; font-size:13.3px;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0 20px;}
  .table-scroll table.datatable{margin:0; min-width:420px;}
  table.datatable th{
    text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); padding:7px 10px; border-bottom:1.5px solid var(--line-strong); background:var(--paper-dim);
  }
  table.datatable td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.datatable tr:hover td{background:var(--steel-tint);}
  .mono{font-family:var(--mono);}

  .riskgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 22px;}
  .riskgrid.cols-2{grid-template-columns:1fr 1fr;}
  .riskcard{border-radius:6px; padding:14px; border:1px solid var(--line);}
  .riskcard.low{background:var(--low-tint); border-color:#bcdcc9;}
  .riskcard.mid{background:var(--mid-tint); border-color:#e3cf9f;}
  .riskcard.high{background:var(--high-tint); border-color:#e5b8b2;}
  .riskcard h4{margin:0 0 6px; font-family:var(--display); font-size:13.5px;}
  .riskcard.low h4{color:var(--low);}
  .riskcard.mid h4{color:var(--mid);}
  .riskcard.high h4{color:var(--high);}
  .riskcard p, .riskcard ul{font-size:12.8px; margin:0;}
  .riskcard ul{padding-left:16px;}

  .sources{
    margin-top:38px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-soft);
  }
  .sources h4{
    font-family:var(--mono); text-transform:uppercase; letter-spacing:.5px; font-size:10.5px;
    margin:0 0 8px; color:var(--ink-soft);
  }
  .sources ul{margin:0; padding-left:18px;}
  .sources li{margin-bottom:4px;}

  .disclaimer{
    margin-top:20px; padding:10px 14px; background:#FBF8EF; border:1px solid #E7DCB8;
    border-radius:4px; font-size:12px; color:#6B5A2B;
  }
  .footnote{
    font-size:12px; color:var(--ink-soft); font-style:italic; margin:10px 0 0;
    padding-left:10px; border-left:2px solid var(--line-strong);
  }

  .viewtoggle{display:flex; gap:0; margin-bottom:22px; border:1px solid var(--line-strong); border-radius:20px; width:fit-content; overflow:hidden;}
  .viewtoggle button{
    border:none; background:var(--card); padding:7px 18px; font-family:var(--mono); font-size:12px;
    cursor:pointer; color:var(--ink-soft); letter-spacing:.3px;
  }
  .viewtoggle button.active{background:var(--steel); color:#fff;}
  .viewpane{display:none;}
  .viewpane.active{display:block;}

  .steplist{list-style:none; margin:0 0 18px; padding:0; counter-reset:step;}
  .steplist li{
    counter-increment:step; position:relative; padding:10px 0 10px 40px; border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .steplist li:last-child{border-bottom:none;}
  .steplist li::before{
    content:counter(step); position:absolute; left:0; top:9px; width:26px; height:26px;
    background:var(--steel); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; font-weight:500;
  }
  .steplist.compact li{padding:7px 0 7px 34px; font-size:13.5px;}
  .steplist.compact li::before{width:21px; height:21px; font-size:10.5px; top:6px;}

  .stepblock{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .stepblock:last-child{border-bottom:none;}
  .stepblock .stepnum{
    display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
    background:var(--amber); color:#fff; border-radius:50%; font-family:var(--mono); font-size:11.5px; margin-right:8px;
  }
  .stepblock h3{display:inline; font-size:15px;}
  .stepblock .body{margin-top:8px; padding-left:32px;}
  .stepblock .body p{font-size:13.8px; margin-bottom:8px;}
  .stepblock .body ul{font-size:13.3px;}

  .badge-inline{
    display:inline-block; font-family:var(--mono); font-size:10px; padding:1px 7px; border-radius:10px;
    background:var(--high-tint); color:var(--high); margin-left:6px;
  }

  .placeholder{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .placeholder .icon{font-size:34px; margin-bottom:10px;}

  .home-hero{
    background:linear-gradient(135deg, var(--steel-deep), var(--steel));
    color:#fff; padding:44px 40px; border-radius:8px; margin-bottom:32px;
  }
  .home-hero h1{font-family:var(--display); font-size:30px; margin:0 0 10px; font-weight:700;}
  .home-hero p{font-size:14.5px; max-width:600px; color:#D9E2EC; margin:0;}
  .home-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:8px;}
  .home-card{
    background:var(--card); border:1px solid var(--line); border-radius:6px; padding:18px;
    border-top:3px solid var(--steel);
  }
  .home-card.malign{border-top-color:var(--high);}
  .home-card.kirurgi{border-top-color:var(--amber);}
  .home-card h3{margin:0 0 6px; font-family:var(--display); font-size:15px;}
  .home-card p{font-size:12.8px; color:var(--ink-soft); margin:0 0 10px;}
  .home-card a{font-size:12.5px; font-family:var(--mono);}

  @media(max-width:880px){
    .hamburger{display:block;}
    .sidebar{
      position:fixed; left:-300px; top:56px; height:calc(100vh - 56px); width:280px; z-index:50;
      transition:left .2s ease; box-shadow:4px 0 16px rgba(0,0,0,.15);
    }
    .sidebar.open{left:0;}
    .main{padding:20px 16px 80px;}
    .home-grid{grid-template-columns:1fr;}
    .riskgrid{grid-template-columns:1fr;}
    .riskgrid.cols-2{grid-template-columns:1fr;}
    .searchwrap{max-width:none;}
    .topbar .brand .sub{display:none;}
    .navlist li a{padding:10px 18px; font-size:14.5px;}
    .home-hero{padding:28px 22px;}
    .home-hero h1{font-size:23px;}
    .home-hero p{font-size:13.5px;}
    h1.pagetitle{font-size:24px;}
    .stepblock .body{padding-left:0; margin-top:6px;}
    .stepblock .stepnum{margin-bottom:4px;}
    .steplist li{padding-left:36px;}
    .steplist li::before{width:23px; height:23px; font-size:11px;}
    .viewtoggle{width:100%;}
    .viewtoggle button{flex:1; padding:9px 10px;}
    .content h2{font-size:17px; margin:26px 0 10px;}
    .riskcard{padding:12px;}
  }
  .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:45;}
  .overlay.show{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Meny">☰</button>
  <div class="brand">UroOppslag <span class="sub">// LIS-oppslagsverk i urologi</span></div>
  <div class="searchwrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FA1B7" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Søk (f.eks. TURP, Gleason, PSA-residiv)…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */

const CATEGORIES = [
  {id:'akutt', label:'Akutturologi', swatch:'sw-akutt'},
  {id:'benigne', label:'Benigne tilstander', swatch:'sw-benign'},
  {id:'maligne', label:'Maligne tilstander', swatch:'sw-malign'},
  {id:'kirurgi', label:'Operasjonsteknikker', swatch:'sw-kirurgi'},
  {id:'admin', label:'Henvisningsvurdering', swatch:'sw-admin'},
  {id:'om', label:'Om siden', swatch:'sw-benign'}
];

const TOPICS = [
  {id:'urinretensjon-akutt', cat:'akutt', title:'Akutt urinretensjon', status:'ferdig', icd:'R33.9'},
  {id:'priapisme', cat:'akutt', title:'Priapisme', status:'ferdig', icd:'N48.3'},
  {id:'penisfraktur', cat:'akutt', title:'Penisfraktur', status:'ferdig', icd:'S39.848 / N48.8'},
  {id:'fourniers-gangren', cat:'akutt', title:'Fourniers gangren', status:'ferdig', icd:'N49.3'},
  {id:'blaretamponade', cat:'akutt', title:'Blæretamponade (koagelretensjon)', status:'ferdig', icd:'N32.8 / R31.9'},
  {id:'via-falsa', cat:'akutt', title:'Via falsa (falsk urinrørskanal)', status:'ferdig', icd:'N99.8 / T83.5'},


  {id:'bph', cat:'benigne', title:'Benign prostatahyperplasi (BPH)', status:'ferdig', icd:'N40'},
  {id:'nyrestein', cat:'benigne', title:'Urolithiasis / nyrestein', status:'ferdig', icd:'N20'},
  {id:'oab', cat:'benigne', title:'Overaktiv blære / LUTS', status:'ferdig', icd:'N39.4'},
  {id:'fimose', cat:'benigne', title:'Fimose og balanitt', status:'ferdig', icd:'N47 / N48.1'},
  {id:'hydrocele', cat:'benigne', title:'Hydrocele og varikocele', status:'ferdig', icd:'N43.3 / I86.1'},
  {id:'epididymitt', cat:'benigne', title:'Epididymitt / akutt skrotum', status:'ferdig', icd:'N45 / N44'},
  {id:'ed', cat:'benigne', title:'Erektil dysfunksjon', status:'ferdig', icd:'N48.4'},
  {id:'nevrogen', cat:'benigne', title:'Nevrogen blære', status:'ferdig', icd:'N31'},
  {id:'bekkensmerter', cat:'benigne', title:'Bekkensmerter / smertefullt blæresyndrom', status:'ferdig', icd:'R10.2'},
  {id:'stressinkontinens', cat:'benigne', title:'Stressinkontinens', status:'ferdig', icd:'N39.3'},
  {id:'urinrorsstriktur', cat:'benigne', title:'Urinrørsstriktur', status:'ferdig', icd:'N35.8'},

  {id:'prostatakreft', cat:'maligne', title:'Prostatakreft', status:'ferdig', icd:'C61'},
  {id:'blarekreft', cat:'maligne', title:'Blærekreft (urotelialt karsinom)', status:'ferdig', icd:'C67'},
  {id:'nyrekreft', cat:'maligne', title:'Nyrekreft (RCC)', status:'ferdig', icd:'C64'},
  {id:'testikkelkreft', cat:'maligne', title:'Testikkelkreft', status:'ferdig', icd:'C62'},
  {id:'peniskreft', cat:'maligne', title:'Peniskreft', status:'ferdig', icd:'C60'},
  {id:'ovreurotelial', cat:'maligne', title:'Øvre urotelial kreft', status:'ferdig', icd:'C65 / C66'},

  {id:'ralp', cat:'kirurgi', title:'RALP — Robotassistert prostatektomi', status:'ferdig'},
  {id:'turp', cat:'kirurgi', title:'TURP', status:'ferdig', ncsp:'KED22', icd:'N40'},
  {id:'turbt', cat:'kirurgi', title:'TURBT', status:'ferdig', ncsp:'KCD02', icd:'C67'},
  {id:'nefrektomi', cat:'kirurgi', title:'Nefrektomi (radikal/partiell)', status:'ferdig'},
  {id:'rirs', cat:'kirurgi', title:'Ureterorenoskopi / RIRS', status:'ferdig', ncsp:'KBE12, KBV02', icd:'N20.1'},
  {id:'pcnl', cat:'kirurgi', title:'PCNL', status:'ferdig'},
  {id:'cystektomi', cat:'kirurgi', title:'Cystektomi og urinavledning', status:'ferdig'},
  {id:'sirkumsisjon', cat:'kirurgi', title:'Sirkumsisjon', status:'ferdig', ncsp:'KGH10', icd:'N47'},
  {id:'vasektomi', cat:'kirurgi', title:'Vasektomi', status:'ferdig'},
  {id:'orkidopeksi', cat:'kirurgi', title:'Orkidopeksi', status:'ferdig', ncsp:'KFH10', icd:'Q53.1'},
  {id:'testistorsjon-op', cat:'kirurgi', title:'Detorkvering og fiksasjon ved testistorsjon', status:'ferdig', ncsp:'KFH20, KFH10', icd:'N44'},
  {id:'intern-uretrotomi', cat:'kirurgi', title:'Intern uretrotomi', status:'ferdig', ncsp:'KDV12, KCX20', icd:'N35.8'},
  {id:'botox-blare', cat:'kirurgi', title:'Botulinumtoksin (Botox) i blære', status:'ferdig'},
  {id:'snm', cat:'kirurgi', title:'Sakral nervemodulasjon (SNM)', status:'ferdig'},
  {id:'optilume', cat:'kirurgi', title:'Optilume (medikamentavgivende ballongdilatasjon)', status:'ferdig', ncsp:'KDH62, KUD02', icd:'N35.8'},
  {id:'cystolitotripsi', cat:'kirurgi', title:'Cystolitotripsi', status:'ferdig', ncsp:'KCE02', icd:'N21.0'},
  {id:'hydrocelectomi', cat:'kirurgi', title:'Hydrocelectomi ad modum Winkelmann', status:'ferdig', ncsp:'KFD20', icd:'N43.3'},
  {id:'orkiektomi', cat:'kirurgi', title:'Orkiektomi (unilateral)', status:'ferdig', ncsp:'KFC00', icd:'C62 / N51.1'},
  {id:'penisplastikk', cat:'kirurgi', title:'Penisplastikk (Peyronies sykdom)', status:'ferdig', ncsp:'KGH20', icd:'N48.6'},
  {id:'inkontinenskirurgi', cat:'kirurgi', title:'Midturetral slynge og kunstig urinsfinkter', status:'ferdig', icd:'N39.3'},

  {id:'henvisningsvurdering', cat:'admin', title:'Prioritering av henvisninger', status:'ferdig'},

  {id:'om-siden', cat:'om', title:'Om siden og kilder', status:'ferdig'}
];

const TAGCLASS = {benigne:'tag-benign', maligne:'tag-malign', kirurgi:'tag-kirurgi', admin:'tag-internal', akutt:'tag-akutt'};
const TAGLABEL = {benigne:'Benign', maligne:'Malign', kirurgi:'Operasjonsteknikk', admin:'Administrativt', akutt:'Akutt'};

/* ============================================================
   CONTENT MAP
   type: 'simple' -> {intro?, html}
   type: 'toggle' -> {intro?, short, detailed}
   ============================================================ */
const CONTENT_MAP = {};

/* ---------------- PROSTATAKREFT ---------------- */

<div class="callout">
<b>Kjapt sammendrag</b>
Prostatakreft er den vanligste kreftformen hos menn i Norge. De fleste tilfeller er lokalisert og langsomtvoksende. Utredning bygger på PSA → mpMR prostata → målrettet + systematisk biopsi. Risikogruppering (EAU-modellen) styrer valg mellom aktiv overvåking, kirurgi, stråling og eventuell hormonbehandling.
</div>

<h2>Epidemiologi</h2>
<p>Prostatakreft utgjør om lag 30 % av all kreft hos menn i Norge, og er den hyppigste kreftdiagnosen hos menn totalt. Om lag hver åttende mann får diagnosen før fylte 75 år. De fleste dør med, ikke av, sykdommen — noe som er selve grunnlaget for risikostratifisert, ikke ensartet aggressiv, behandling.</p>

<h2>Utredning</h2>
<h3>PSA</h3>
<p>PSA er organspesifikt, ikke kreftspesifikt — forhøyet verdi kan også skyldes BPH, prostatitt, nylig instrumentering (kateterisering, cystoskopi, biopsi) eller ejakulasjon. Det finnes ingen biologisk grenseverdi for PSA som skiller behandlingstrengende fra ikke-behandlingstrengende kreft — <strong>populasjonsbasert screening er ikke innført i Norge</strong>.</p>

<h4>Hvem bør testes</h4>
<ul>
<li>Asymptomatiske menn som selv ønsker det, bør tilbys PSA + DRE som ledd i en individuell, risikotilpasset strategi — beslutning tas i samråd med lege etter nøktern informasjon om fordeler/ulemper</li>
<li>PSA-testing er som hovedregel <strong>ikke aktuelt hos menn &lt;50 år uten risikofaktorer</strong>, eller hos menn <strong>&gt;80 år</strong></li>
<li>Aldersgruppe 70–79 år: individuell vurdering. Aktsomhet ved forventet levetid &lt;10 år</li>
<li>PSA bør ikke tas for å avdekke tidlig kreft hos menn med forventet levetid &lt;10–15 år som ikke er kandidater for kurativ lokalbehandling</li>
<li>Testing bør avsluttes når det ikke lenger er hensiktsmessig — urolog bør da skissere en skriftlig plan for videre PSA-oppfølging/aksjonsgrenser til pasient og fastlege</li>
</ul>

<h4>Arvelig risiko — egen algoritme</h4>
<p>Menn med påvist genfeil som gir økt risiko for behandlingstrengende prostatakreft (særlig <em>BRCA2</em>, også <em>HOXB13, MSH2, MSH6</em>) bør måle PSA <strong>årlig fra 40 års alder</strong>. Uten påvist genfeil, men ved familiær opphopning, kan PSA-testing fra 40 år tilbys ved:</p>
<ul>
<li>Én førstegradsslektning med prostatakreft ≤60 år, <strong>eller</strong></li>
<li>To nære slektninger med prostatakreft, snittalder ≤70 år, <strong>eller</strong></li>
<li>Tre nære slektninger med prostatakreft uansett alder</li>
</ul>
<p>Disse henvises urolog ved: PSA utenfor referanseområdet for pasientens alder, økning &gt;1 ng/mL på ett år, eller dobling av verdien i løpet av ett år.</p>

<h4>Ved symptomer/funn</h4>
<ul>
<li>PSA skal <strong>alltid</strong> tas ved DRE-funn som gir mistanke om prostatakreft — malignitetssuspekte palpasjonsfunn henvises urolog <strong>uavhengig av PSA-nivå</strong></li>
<li>Ingen sikker sammenheng mellom obstruktive vannlatingssymptomer (LUTS) og behandlingstrengende prostatakreft — beslutning om PSA-testing ved LUTS tas på samme grunnlag som hos asymptomatiske menn</li>
<li>PSA tas ved utredning av metastaser med ukjent utgangspunkt, spesielt ved sklerotiske skjelettlesjoner eller bekken-/retroperitoneal glandelsvulst</li>
</ul>

<h4>Tolkning</h4>
<div class="callout amber"><b>Praktisk håndtering av forhøyet PSA</b>Ved forhøyet PSA og normal DRE: kontrollmål etter <strong>minst 3 uker</strong>. Utelukk samtidig urinveisinfeksjon — ved påvist infeksjon gjentas målingen etter <strong>1–2 måneder</strong>.</div>
<p class="mono" style="font-size:12px;color:var(--ink-soft)">Merk: referanseverdier oppgitt i labsvar kan avvike fra aksjonsgrensene for henvisning til spesialisthelsetjenesten beskrevet her. Tolkning hos menn uten risikofaktorer må sees i sammenheng med alder og PSA-verdi (handlingsprogrammets Figur 5.1) — denne aldersjusterte grafiske fremstillingen er ikke gjengitt i detalj her; se originalkilden for de eksakte alderstilpassede aksjonsgrensene.</p>

<h4>Hvorfor kan palpasjonsfunn alene gi henvisning til pakkeforløp?</h4>
<p>«Begrunnet mistanke» om prostatakreft — som utløser pakkeforløp — baseres på <strong>enten</strong> bekreftet høy PSA <strong>eller</strong> klinisk mistanke (funn ved DRE, eller tilfeldig UL-prostata-/MR-bekken-funn av annen grunn). Dette er et <em>enten/eller</em>-kriterium, ikke et krav om at begge skal foreligge samtidig. Bakgrunnen er at enkelte aggressive prostatakarsinomer (bl.a. lite differensierte og duktale subtyper) ikke nødvendigvis gir proporsjonal PSA-stigning — en suspekt kjertel ved palpasjon har egen selvstendig prediktiv verdi for malignitet, uavhengig av PSA-nivå. <strong>Motsatt</strong> skal en enkelt forhøyet PSA-verdi <em>ikke</em> i seg selv føre til biopsering — den skal først bekreftes og suppleres med mpMR, siden PSA alene har lav spesifisitet.</p>

<div class="callout internal"><b>Ahus internt</b>Ahus har (2026–2027) et pilotprosjekt for populasjonsbasert/organisert PSA-testing, finansiert av Kreftforeningen, Prostatakreftforeningen og Helse Sør-Øst. Menn født 1972–1977 i Ahus' opptaksområde inviteres via Helsenorge til PSA-test; ved forhøyet verdi følges MR og ev. biopsi. Tilsvarende pilotprosjekter pågår i flere europeiske land, bl.a. Sverige, i tråd med EU-kommisjonens 2022-anbefaling om å vurdere organisert screening for prostatakreft.</p></div>

<h3>mpMR prostata</h3>
<p>Multiparametrisk MR gjøres før biopsi, og vurderes med PI-RADS-score (1–5). MR brukes til å målstyre biopsier, men <strong>klinisk T-stadium (cT) settes fortsatt kun på grunnlag av DRE</strong> — ikke MR-funn — ved risikogruppering. Ved kontraindikasjon mot MR (enkelte pacemakere, ICD, cochleaimplantat) kan PSMA-PET/CT vurderes som alternativ der tilgjengelig; ellers gjøres systematiske UL-veiledede biopsier uten forutgående bildediagnostikk. Tradisjonell (ikke-multiparametrisk) ultralyd og røntgen/CT/skjelettscintigrafi har ingen rolle i lokal staging av prostatakreft.</p>

<h3>Biopsi</h3>
<p>Kombinasjon av MR-målrettede biopsier (PI-RADS ≥3) og systematiske biopsier er standard. Indikasjon for prostatabiopsi baseres på malignitetssuspekt palpasjonsfunn, MR-funn (PI-RADS) og/eller PSA-tetthet — se koelis-prosedyren under. En forutsetning for biopsering er at forventet gjenstående levetid (alder, komorbiditet, funksjon) tilsier gevinst av behandling. Ved flere ISUP-graderte lesjoner brukes høyeste ISUP-grad for risikogruppering.</p>

<h4>Patologiske risikofaktorer i biopsisvaret — hvorfor de vektlegges</h4>
<p>Utover selve ISUP-graden ser patologen etter flere funn som har selvstendig prognostisk betydning og kan endre behandlingsvalg allerede før bildediagnostikk/kirurgi:</p>
<ul>
<li><strong>Infiltrasjon i periprostatisk fettvev:</strong> tilsvarer ekstraprostatisk vekst (EPE, ~pT3a-ekvivalent) allerede påvist på biopsinivå — indikerer lokalavansert sykdom og kan endre behandlingsplanlegging (f.eks. styrke indikasjon for utvidet feltbestråling eller diskusjon om nervesparingsgrad ved kirurgi) før man i det hele tatt har fått bildediagnostikk.</li>
<li><strong>Perinevral vekst:</strong> tumor vokser langs/rundt nervetråder — en kjent spredningsvei for ekstraprostatisk vekst langs de nevrovaskulære buntene. Assosiert med økt risiko for positive reseksjonsrender ved kirurgi og biokjemisk residiv, og er direkte relevant for beslutning om grad av nervesparing ved RALP.</li>
<li><strong>Kribriforme strukturer og IDC-P (intraduktalt karsinom i prostata):</strong> økende anerkjent som selvstendig ugunstig prognostisk faktor <em>selv innenfor samme Gleason-score</em> — assosiert med høyere risiko for metastase, biokjemisk residiv og prostatakreftspesifikk død. Bør rapporteres eksplisitt av patolog uavhengig av Gleason-score, og påvirker i praksis risikovurdering/behandlingsintensitet selv om det ennå ikke er formelt innarbeidet som egen tier i EAUs risikogruppering.</li>
</ul>

<h4>Hvorfor ISUP-gradgruppe — og hvorfor «grad 4» er så viktig</h4>
<p>Gleason-score (2–10) ble historisk oppfattet forvirrende av pasienter — en «Gleason 6»-diagnose hørtes ut som midtsjiktet alvorlighet, selv om den faktisk representerer den mildeste, indolente kategorien. Dette bidro til unødig engstelse og overbehandling. ISUP-gradgruppene (1–5) ble innført for å gi et tallsystem som bedre gjenspeiler faktiske prognostiske sjikt.</p>
<p>Andelen <strong>Gleason-mønster 4</strong> er selve kjernen i systemet: Gleason-score 7 deles i gradgruppe 2 (3+4, overvekt av mønster 3) og gradgruppe 3 (4+3, overvekt av mønster 4) nettopp fordi disse har ulik prognose — jo mer mønster 4, desto verre prognose. Av samme grunn angir patologen ofte eksakt <em>prosentandel</em> mønster 4/5 i tillegg til selve gradgruppen, og kommenterer eventuelt <em>tertiært mønster</em> (en liten komponent av høyeste malignitetsgrad, særlig mønster 5, selv om den ikke er dominerende) — også en liten andel høygradig komponent har vist selvstendig prognostisk vekt utover hovedgraderingen.</p>

<h4>Briganti-score — risiko for lymfeknutespredning</h4>
<p>Briganti-nomogrammet er et validert verktøy som estimerer sannsynligheten for lymfeknutemetastaser (pN1) basert på PSA, klinisk T-stadium, ISUP-gradgruppe fra biopsi, og andel positive biopsisylindre (nyere versjoner inkluderer også MR-funn). Brukes klinisk til å avgjøre om <strong>utvidet bekken-lymfeknutedisseksjon</strong> er indisert ved RALP — en estimert risiko <strong>≥5 %</strong> brukes ofte som terskel for å anbefale utvidet disseksjon (se RALP under Operasjonsteknikker).</p>
<div class="callout amber"><b>Om kalkulator</b>Vi har bevisst valgt å <em>ikke</em> bygge inn en egen tallkalkulator for Briganti-score her. Nomogrammet bygger på validerte regresjonskoeffisienter fra det opprinnelige datasettet, og en forenklet/uverifisert etterligning kunne gi feilaktige risikoestimat — med reell klinisk konsekvens dersom det legges til grunn for beslutning om lymfeknutedisseksjon. Bruk et validert verktøy (f.eks. MSKCC sine prediksjonsverktøy for prostatakreft eller tilsvarende nomogram-tjenester) for faktisk risikoberegning.</div>

<h4>Valg av supplerende stagingundersøkelser</h4>
<p>Hensikten med supplerende bildediagnostikk er å avklare sykdomsutbredelse for å styre behandlingsvalg — nytteverdien avhenger av sannsynligheten for funn med reell behandlingskonsekvens. Praktisk tilnærming:</p>
<ul>
<li><strong>Lavrisikosykdom:</strong> supplerende metastaseutredning er normalt ikke indisert</li>
<li><strong>Intermediær og høyrisikosykdom:</strong> utredning for skjelett- og lokoregionale lymfeknutemetastaser vurderes</li>
<li><strong>PSMA-PET/CT er førstevalg der tilgjengelig</strong> — mest sensitive modalitet, kan med fordel kombineres med fulldose CT med intravenøs kontrast, slik at annen bildediagnostikk (CT thorax/abdomen/bekken, skjelettscintigrafi) kan sløyfes</li>
<li><strong>MR</strong> er et alternativ som samtidig kan kartlegge både lymfeknuter og skjelett (f.eks. med T2-vektet Dixon-sekvens) — særlig aktuelt der PSMA-PET ikke er tilgjengelig</li>
<li>Ved påviste fjernmetastaser (MR/PSMA-PET) kan supplerende CT thorax/abdomen/bekken og skjelettscintigrafi brukes for å skille høy fra lav metastasebyrde — relevant fordi lav metastasebyrde kan gi grunnlag for å legge til prostatabestråling ved metastatisk sykdom</li>
</ul>


<h3>Biopsibeslutning ved PSA-tetthet og PI-RADS («koelis-prosedyre»)</h3>
<p>Biopsibeslutning kan støttes av en kombinasjon av MR-funn (PI-RADS) og PSA-tetthet (PSA/prostatavolum, ng/mL²):</p>
<div class="table-scroll"><table class="datatable">
<tr><th>MR</th><th>PSA-tetthet &lt;0,1</th><th>PSA-tetthet 0,1–0,149</th><th>PSA-tetthet 0,15–0,199</th><th>PSA-tetthet ≥0,2</th></tr>
<tr><td>Negativ/PI-RADS 1–2</td><td>Ingen biopsi</td><td>Ingen biopsi</td><td>Ingen biopsi</td><td>Biopsi (S)</td></tr>
<tr><td>PI-RADS 3</td><td>Ingen biopsi</td><td>Biopsi (M+/-P)</td><td>Biopsi (M+/-P)</td><td>Biopsi (M+S)</td></tr>
<tr><td>PI-RADS 4–5</td><td>Biopsi (M+/-P)</td><td>Biopsi (M+/-P)</td><td>Biopsi (M+/-P)</td><td>Biopsi (M+S)</td></tr>
</table></div>
<p class="mono" style="font-size:12px;color:var(--ink-soft)">M = målrettet biopsi, P = planleggingsbiopsi (kartleggingsbiopsi), S = systematisk biopsi.</p>
<ul>
<li>Biopsi tas ved positiv DRE uavhengig av tabellen over</li>
<li>Hereditet (arvelig disposisjon) kan tilsi biopsi utenom tabellen</li>
</ul>

<h2>Klassifikasjon og staging</h2>
<h3>TNM (8. utgave)</h3>
<div class="table-scroll"><table class="datatable">
<tr><th>Stadium</th><th>Betydning</th></tr>
<tr><td class="mono">T1c</td><td>Ikke palpabel, kun påvist ved biopsi (vanligst i dag)</td></tr>
<tr><td class="mono">T2a–c</td><td>Palpabel, begrenset til prostata</td></tr>
<tr><td class="mono">T3a</td><td>Ekstrakapsulær vekst, ev. mikroskopisk innvekst i blærehals</td></tr>
<tr><td class="mono">T3b</td><td>Innvekst i vesicula seminalis</td></tr>
<tr><td class="mono">T4</td><td>Fiksert eller innvekst i naboorgan</td></tr>
<tr><td class="mono">N1</td><td>Regional lymfeknutemetastase</td></tr>
<tr><td class="mono">M1a/b/c</td><td>Fjernmetastase — a: lymfeknuter, b: skjelett, c: andre organer</td></tr>
</table></div>

<h3>Gleason / ISUP-gradgruppe</h3>
<div class="table-scroll"><table class="datatable">
<tr><th>Gleason-score</th><th>ISUP grad-gruppe</th></tr>
<tr><td class="mono">≤6</td><td>1</td></tr>
<tr><td class="mono">7 (3+4)</td><td>2</td></tr>
<tr><td class="mono">7 (4+3)</td><td>3</td></tr>
<tr><td class="mono">8</td><td>4</td></tr>
<tr><td class="mono">9–10</td><td>5</td></tr>
</table></div>

<h3>EAU risikogruppering (ikke-metastatisk sykdom)</h3>
<div class="riskgrid">
  <div class="riskcard low"><h4>Lav risiko</h4><p>ISUP 1 <strong>og</strong> PSA &lt;10 <strong>og</strong> cT1–2a</p></div>
  <div class="riskcard mid"><h4>Intermediær risiko</h4><p><strong>Gunstig:</strong> ISUP 2, PSA &lt;10, cT1–2b<br><strong>Ugunstig:</strong> ISUP 3, eller ISUP 2 m/PSA 10–20</p></div>
  <div class="riskcard high"><h4>Høy risiko</h4><p><strong>Lokalisert:</strong> ISUP 4–5, PSA &gt;20, eller cT2c<br><strong>Lokalavansert:</strong> cT3–4 eller cN+</p></div>
</div>

<h2>Behandling etter risikogruppe</h2>
<h3>Lav risiko</h3>
<p><strong>Aktiv overvåking</strong> er standard ved forventet levetid ≥10 år.</p>
<h3>Intermediær risiko</h3>
<p>Både RALP og strålebehandling diskuteres som likeverdige. Kortvarig ADT (4–6 mnd) ved radikal stråling.</p>
<h3>Høy risiko, lokalisert</h3>
<p>RALP er kirurgisk standard, ofte med utvidet lymfeknutedisseksjon. Langvarig ADT (2–3 år); ved ekstra høy risiko legges abirateron/prednisolon til i 2 år.</p>
<h3>Høy risiko, lokalavansert</h3>
<p>Strålebehandling er standard. Ved cN1: stråling mot prostata og bekkenfelt + intensivert ADT.</p>

<h2>PSA-residiv og salvage-behandling</h2>
<div class="callout amber"><b>Etter RALP</b>PSA ≥ 0,10 ng/mL ved to påfølgende prøver → henvises urolog.</div>
<div class="callout amber"><b>Etter radikal stråling</b>PSA-stigning ≥2 ng/mL over nadir.</div>
<p>Moderne praksis favoriserer <strong>tidlig salvage-stråling</strong> fremfor rutinemessig adjuvant stråling. Konkomitant kortvarig ADT bedrer utfall ved høy Gleason/ISUP eller kort PSADT.</p>

<h2>Medikamentell behandling ved metastatisk sykdom</h2>
<p><strong>ADT</strong> er paraplybegrep for all androgenreduserende behandling (kastrasjon + antiandrogener). <strong>NHT</strong> brukes spesifikt om enzalutamid, apalutamid, darolutamid og abirateron — bikalutamid regnes ikke som NHT.</p>

<h4>Grunnlaget for ADT</h4>
<p>Prostatakreftceller er i utgangspunktet androgenavhengige (Huggins' klassiske observasjon) — androgenreduksjon gir derfor tumorregresjon/-stabilisering hos de fleste pasienter innledningsvis. ADT brukes langs hele spekteret: som tillegg til strålebehandling ved intermediær/høyrisiko lokalisert sykdom (se Behandling etter risikogruppe), og som ryggraden i behandling av metastatisk sykdom.</p>

<h4>Bikalutamid som monoterapi — når og hvorfor</h4>
<p>Bikalutamid alene (uten kastrasjon) bevarer libido, bentetthet og muskelmasse bedre enn kastrasjonsbasert ADT, og har historisk vært brukt som alternativ hos pasienter med lokalavansert (ikke-metastatisk) sykdom som prioriterer livskvalitet. EAU-guidelines påpeker imidlertid at bikalutamid-monoterapi gir <strong>svakere onkologisk kontroll</strong> enn kastrasjonsbasert behandling, særlig ved metastatisk sykdom. I dagens praksis er bikalutamid-monoterapi derfor stort sett reservert til:</p>
<ul>
<li>Kortvarig «flare»-beskyttelse ved oppstart av GnRH-agonist (se Zoladex/Firmagon)</li>
<li>Selekterte pasienter med lokalavansert, ikke-metastatisk sykdom som etter samvalg aktivt prioriterer bevart seksualfunksjon/livskvalitet fremfor maksimal onkologisk kontroll, med forståelse for denne avveiningen</li>
</ul>

<h4>Grunnlaget for å legge til NHT</h4>
<p>Store fase III-studier (STAMPEDE, LATITUDE, TITAN, ARCHES) har vist overlevelsesgevinst av å legge NHT (abirateron, enzalutamid, apalutamid) til ADT ved hormonsensitiv metastatisk sykdom, sammenlignet med ADT alene — som historisk var standard. ADT alene brukes derfor i dag sjelden som eneste behandling ved nyoppdaget metastatisk sykdom hos pasienter som tåler intensivert behandling.</p>

<h4>Doublet vs. triplet — hvilke betraktninger gjøres</h4>
<p>Tillegg av docetaksel til ADT+NHT (triplet, basert på PEACE-1 og ARASENS-studiene) gir ytterligere gevinst, særlig ved høyt tumorvolum/høyrisikosykdom. Valget mellom doublet (ADT+NHT) og triplet (ADT+NHT+docetaksel), samt hvilket NHT-middel som velges, baseres på en samlet vurdering av:</p>
<ul>
<li><strong>Tumorvolum</strong> (CHAARTED-kriterier — høyt vs. lavt volum basert på antall/lokalisasjon av metastaser)</li>
<li><strong>Risikokategori</strong> (LATITUDE-kriterier for høyrisiko metastatisk sykdom)</li>
<li>Pasientens allmenntilstand, komorbiditet og evne til å tåle kjemoterapi</li>
<li>Bivirkningsprofil og pasientens preferanser (f.eks. abirateron krever samtidig prednisolon og monitorering av leverfunksjon/blodtrykk; enzalutamid/apalutamid har annen bivirkningsprofil bl.a. mtp. fatigue/kognitive symptomer og krampeterskel)</li>
<li>Tilgjengelighet/godkjenning i norsk klinisk praksis</li>
</ul>

<p>Standard ved hormonsensitiv metastatisk sykdom er dermed ADT + NHT (doublet), ev. + docetaksel (triplet) ved høyt tumorvolum/høyrisiko og god allmenntilstand.</p>
<div class="callout amber"><b>Definisjon — kastrasjonsresistent sykdom (CRPC)</b>Kastrasjonsnivå testosteron (&lt;1,7 nmol/L) <strong>og</strong> én av: (1) PSA-stigning &gt;50 % over nadir <strong>og</strong> PSA &gt;2 ng/mL, og/eller (2) radiologisk progresjon.</div>
<p>Ved CRPC vurderes NHT-bytte, kjemoterapi, radionuklidbehandling og PARP-hemmer ved BRCA-mutasjon. PSA brukes aktivt i oppfølging av metastatisk sykdom, men alltid sammen med klinisk vurdering, markører for osteoblastaktivitet (ALP) og generell kreftaktivitet (LDH), samt bildediagnostikk — PSA-utvikling reflekterer ikke alltid det kliniske forløpet.</p>

<h2>Oppfølging</h2>
<ul>
<li>Aktiv overvåking: regelmessig PSA, DRE, re-biopsi/MR</li>
<li>Etter RALP/stråling: PSA-kontroll etter residiv-kriteriene over</li>
<li>Metastatisk sykdom: tett urolog/onkolog-samarbeid</li>
</ul>

<h3>Oppfølging etter RALP (Helsedirektoratets anbefaling)</h3>
<p>Spesialisthelsetjenesten har ansvar for å planlegge oppfølgingen, i samarbeid med fastlege. Anbefalt kontrollopplegg (klinisk kontroll + PSA, med fokus på bivirkninger og residiv definert som PSA &gt;0,1 ng/mL):</p>
<ul>
<li>3, 6 og 12 måneder — første året</li>
<li>Hver 6. måned — andre og tredje år</li>
<li>Deretter årlig i totalt 5–7 år</li>
<li>Etter 5 år: individuell vurdering ut fra alder og komorbiditet</li>
<li>Pasienter med &lt;10 års forventet levetid bør avslutte PSA-kontroll</li>
</ul>
<p>Pasienten kan re-henvises urologisk avdeling ved plagsom urininkontinens og/eller for bistand med seksuell rehabilitering.</p>

<h3>Kontroll etter prostatektomi — praktisk skjema fra undervisningsmateriale</h3>

CONTENT_MAP['blarekreft'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Over 95 % er urotelialt karsinom. Smertefri makrohematuri er kardinalsymptom. Skillet mellom ikke-muskelinvasiv (NMIBC) og muskelinvasiv (MIBC) sykdom styrer hele behandlingsløpet.</div>

<h2>Epidemiologi og risikofaktorer</h2>
<p>Røyking er den viktigste risikofaktoren. Andre: yrkeseksponering for aromatiske aminer, tidligere strålebehandling mot bekkenet, kronisk irritasjon/infeksjon, og Lynch syndrom (familiær opphopning).</p>

<h2>Utredning</h2>
<p>Cystoskopi og urincytologi er hjørnesteiner ved mistanke om blæretumor. CT urinveier (CT-urografi) kartlegger øvre urinveier og ev. lymfeknute-/fjernspredning. Endelig diagnostikk og initial stadiebestemmelse skjer ved TURBT (se Operasjonsteknikker).</p>

<h2>Klassifikasjon</h2>
<div class="table-scroll"><table class="datatable">
<tr><th>Gruppe</th><th>Definisjon</th></tr>
<tr><td class="mono">NMIBC</td><td>Ta, T1, og CIS (carcinoma in situ) — ikke muskelinvasiv</td></tr>
<tr><td class="mono">MIBC</td><td>≥T2 — infiltrerer detrusormuskulatur</td></tr>
</table></div>
<p>NMIBC risikogrupperes (lav/intermediær/høy) basert på stadium, grad, tumorstørrelse, multiplisitet og residivmønster (EORTC/EAU-modell). Høyrisikogruppen inkluderer alle T1, alle høygradige tumores, CIS, og multiple/store lavgradige Ta-tumores.</p>

<h2>Behandling</h2>
<h3>NMIBC</h3>
<p>TURBT er både diagnostisk og terapeutisk. Enkelt postoperativ instillasjon av mitomycin innen 24t reduserer residivrisiko ved lav/intermediær risiko. Re-TURB innen 2–6 uker anbefales ved T1 eller høygradig sykdom, eller ved ufullstendig initial reseksjon. Adjuvant intravesikal BCG (induksjon + vedlikehold) er standard ved høyrisikosykdom. Radikal cystektomi vurderes ved BCG-refraktær høyrisiko-NMIBC.</p>
<h3>MIBC</h3>
<p>Neoadjuvant cisplatinbasert kombinasjonskjemoterapi + radikal cystektomi med bilateral lymfeknutedisseksjon og urinavledning er standard kurativ behandling (se Cystektomi under Operasjonsteknikker). Trimodal behandling (maksimal TURBT + kjemoterapi + strålebehandling) er et blærebevarende alternativ hos selekterte pasienter, særlig ved kontraindikasjon mot cystektomi.</p>
<h3>Metastatisk sykdom</h3>
<p>Platinabasert kjemoterapi (cisplatin der mulig), immunterapi (checkpoint-hemmere) og antistoff-legemiddelkonjugater (f.eks. enfortumab vedotin) benyttes sekvensielt/i kombinasjon avhengig av linje og platina-egnethet.</p>

<h2>Oppfølging</h2>
<p>Målsettingen med kontroll av NMIBC er å oppdage rekurrens eller progresjon til MIBC. <strong>Tilbakefall som T1 høygradig bør i praksis vurderes som potensielt livstruende sykdom på linje med MIBC.</strong> Cystoskopi er gullstandard i oppfølgingen. Første cystoskopikontroll gjøres <strong>3 måneder etter TURB hos alle</strong>, uavhengig av risikogruppe — resultatet på dette tidspunktet er en viktig prognostisk faktor for senere residiv og progresjon.</p>
<p style="font-size:13px;color:var(--ink-soft)">MIBC følges primært med bildediagnostikk (CT) etter kurativ behandling (cystektomi/trimodal behandling), i tillegg til klinisk kontroll — se Cystektomi under Operasjonsteknikker.</p>

<h3>Kontrollopplegg etter risikogruppe (handlingsprogrammets tabell 8)</h3>
<div class="table-scroll"><table class="datatable">
<tr><th>Risikogruppe</th><th>Cystoskopi-intervall etter TURB (re-TURB)</th></tr>
<tr><td><strong>Lav risiko</strong><br>Primære, solitære, Ta, lavgradig (inkl. PUNLP), &lt;3 cm, ingen CIS</td><td>Cystoskopi 3 mnd. etter TURB/re-TURB<br>Cystoskopi 12 mnd. etter TURB<br>Cystoskopi årlig t.o.m. år 2<br>Små residiv kan elektrokoaguleres poliklinisk</td></tr>
<tr><td><strong>Intermediær risiko</strong><br>Ta lavgradig, men multiple, residiv, eller store (&gt;3 cm)</td><td>Cystoskopi 3 mnd. etter TURB/re-TURB<br>Cystoskopi hver 6. måned i 2 år<br>Cystoskopi årlig fra 3. til 10. år</td></tr>
<tr><td><strong>Høy risiko</strong><br>Minst ett av: T1-svulst, høygradig svulst, CIS</td><td>Cystoskopi + <strong>cytologi</strong> 3 mnd. etter TURB/re-TURB<br>Cystoskopi + cytologi hver 3. mnd. i 2 år<br>Cystoskopi + cytologi hver 6. måned t.o.m. 5. året<br>Cystoskopi + cytologi årlig livslangt etter 5 år</td></tr>
</table></div>
<p style="font-size:12.5px;color:var(--ink-soft)">Egenprodusert tabell, Nasjonalt handlingsprogram for blære- og urotelkreft.</p>

<ul>
<li>Intermediær risiko-svulst med høygradig histologi følges <strong>som høyrisiko</strong></li>
<li>Ved residiv gjenopptas oppfølgingen med cystoskopi 3 mnd. etter, deretter videre som intermediær- eller høyrisikoskjema</li>
<li>Ved høyrisikosvulster suppleres cystoskopi alltid med cytologi</li>
<li>Høy alder, dårlig allmenntilstand, komorbiditet og psykososiale forhold kan tilsi at kontrollene avsluttes</li>
</ul>

<h3>Oppfølging av øvre urinveier</h3>
<p>Urotelial svulst i øvre urinveier under NMIBC-oppfølging er sjelden (2–4 %), høyest ved høyrisikosvulster (T1 høygradig og CIS, opp mot 10 % etter 7 år). Billeddiagnostikk gjøres derfor <strong>ikke rutinemessig</strong>, men kontrastforsterket CT hvert 2. år anbefales hos høyrisikogruppen, med første CT 1 år etter avsluttet behandling (siste TURB/BCG). Faktorer som kan gi indikasjon for hyppigere billeddiagnostikk: utbredt primær CIS, svulst i ureterostium, og hyppig residiverende høyrisikosvulster.</p>

<div class="sources"><h4>Kilder</h4><ul>
<li>Helsedirektoratet — <a href="https://www.helsedirektoratet.no/retningslinjer/blaerekreft-handlingsprogram/oppfolging/oppfolging-av-ikke-muskelinfiltrerende-blaerekreft" target="_blank">Nasjonalt handlingsprogram for blære- og urotelkreft, kap. 10.2: Oppfølging av ikke-muskelinfiltrerende blærekreft</a> (sist oppdatert 24. april 2026)</li>
<li>EAU Guidelines — Non-muscle-invasive og Muscle-invasive Bladder Cancer, uroweb.org</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Sjekk alltid siste versjon på helsedirektoratet.no.</div>
`};

CONTENT_MAP['nyrekreft'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>~850–900 nye tilfeller/år i Norge. Klarcellet nyrecellekarsinom (RCC) utgjør ~70 %. 60 % oppdages tilfeldig ved bildediagnostikk tatt av annen årsak. 5-års overlevelse i Norge ~70 %.</div>

<h2>Risikofaktorer</h2>
<p>Røyking, overvekt, hypertensjon, kronisk nyresvikt/dialyse, og eksponering for trikloretylen. 2–3 % skyldes arvelige syndromer, først og fremst von Hippel-Lindau.</p>

<h2>Utredning</h2>
<p>CT eller MR abdomen med kontrast er hjørnestein for karakterisering og staging. Biopsi vurderes ved diagnostisk usikkerhet, ved liten tumor der aktiv overvåkning overveies, eller før systemisk behandling av metastatisk sykdom uten tidligere histologi.</p>

<h2>Behandling etter utbredelse</h2>
<h3>Lokalisert, liten tumor</h3>
<p>Partiell (nefronsparende) nefrektomi er førstevalg der teknisk gjennomførbart — bevarer nyrefunksjon. Aktiv overvåkning er et alternativ hos skrøpelige pasienter med liten, langsomtvoksende tumor.</p>
<h3>Lokalisert, stor tumor</h3>
<p>Radikal nefrektomi, i dag oftest laparoskopisk/robotassistert.</p>
<h3>Lokalavansert sykdom</h3>
<p>Radikal nefrektomi, ev. med trombektomi ved venetrombe (v. renalis/v. cava).</p>
<h3>Metastatisk sykdom</h3>
<p>Systemisk behandling er hovedpilaren: immunterapikombinasjoner (f.eks. nivolumab/ipilimumab) eller immunterapi + TKI, valgt ut fra IMDC-risikogruppering. Cytoreduktiv nefrektomi kan vurderes hos selekterte pasienter med lav metastasebyrde og god allmenntilstand.</p>

<h2>Komplikasjoner ved kirurgi</h2>
<ul>
<li>Postoperativ blødning, sårinfeksjon</li>
<li>Nedsatt nyrefunksjon (spesielt etter radikal nefrektomi)</li>
<li>DVT/lungeemboli, UVI, pneumoni</li>
<li>Perioperativ mortalitet lav (&lt;1–2 %)</li>
</ul>

<h2>Oppfølging</h2>
<p>Todelt: tidlig postoperativ kontroll av komplikasjoner, blodtrykk og nyrefunksjon, deretter langtidskontroll for residiv/metastaser. 80 % av residiv oppstår innen 2 år, 75–85 % innen 5 år — metastaser etter 10 år forekommer, men er sjeldne.</p>

<div class="sources"><h4>Kilder</h4><ul>

<li>EAU Guidelines — Renal Cell Carcinoma, uroweb.org</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Sjekk alltid siste versjon på helsedirektoratet.no.</div>
`};

CONTENT_MAP['testikkelkreft'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Hyppigste kreftform hos unge menn (20–40 år). Fremragende prognose — 5-års relativ overlevelse ~98–99 % i Norge, selv ved metastatisk sykdom ved diagnose.</div>

<h2>Presentasjon og initial håndtering</h2>
<p>Klassisk presentasjon er en smertefri skrotal kul eller diffus forstørrelse. Utredes med skrotal ultralyd og tumormarkører (AFP, hCG, LDH) <strong>før</strong> orkiektomi — markørene er avgjørende for senere stadieinndeling og responsvurdering. Pasienten skal tilbys sædbanking før kirurgi.</p>

<h2>Kirurgi og histologi</h2>
<p>Inguinal orkiektomi er standard tilnærming (aldri transskrotal biopsi — risiko for endret lymfedrenasje og lokal tumorspredning; se Operasjonsteknikker — Orkiektomi). Testikkelbevarende kirurgi kan vurderes ved solitær testikkel eller bilaterale svulster. Histologisk skilles mellom <strong>seminom</strong> og <strong>non-seminøs germinalcelletumor (NSGCT)</strong> — dette styrer all videre behandling.</p>

<h2>Stadieinndeling</h2>
<p>Endelig stadium settes etter histologisvar, CT thorax/abdomen/bekken og postoperative tumormarkører. Pasienter med dårlig prognose (svært høye markører eller metastaser utenfor lymfeknuter/lunger) henvises direkte til onkologisk avdeling.</p>

<h2>Behandling etter stadium</h2>
<h3>Stadium I</h3>
<p>Overvåkning er ofte foretrukket ved lav residivrisiko, som alternativ til adjuvant kjemoterapi (ett kur karboplatin ved seminom) eller adjuvant behandling ved NSCGT med risikofaktorer (f.eks. karinvasjon).</p>
<h3>Metastatisk sykdom</h3>
<p>Cisplatinbasert kombinasjonskjemoterapi (BEP-regime) er kurativ standard, risikostratifisert etter IGCCCG-kriteriene. Retroperitoneal lymfeknutedisseksjon (RPLND) kan være aktuelt ved reststumor etter kjemoterapi, særlig ved NSGCT.</p>

<h2>Oppfølging og seneffekter</h2>
<p>Strukturerte kontroller med markører og bildediagnostikk, tilpasset stadium, histologi og behandling. Langtidsoppfølging er viktig pga. seneffekter: hypogonadisme (kontroll av testosteron/LH/FSH), økt kardiovaskulær og metabolsk risiko, fertilitetsproblemer, og økt risiko for sekundærkreft.</p>

<div class="sources"><h4>Kilder</h4><ul>
<li>Helsedirektoratet — <a href="https://www.helsedirektoratet.no/retningslinjer/testikkelkreft-handlingsprogram" target="_blank">Nasjonalt handlingsprogram for testikkelkreft</a> (sist oppdatert mai 2025)</li>
<li>SWENOTECA-protokoller (felles norsk-svensk samarbeid)</li>
<li>EAU Guidelines — Testicular Cancer, uroweb.org</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Sjekk alltid siste versjon på helsedirektoratet.no.</div>
`};

<div class="callout amber"><b>Merk</b>Det foreligger <strong>ikke</strong> et eget norsk handlingsprogram for peniskreft. Pakkeforløpet bygger direkte på EAU Guidelines. Behandling foregår sentralisert ved regionsykehus med tverrfaglig team.</div>

<h2>Presentasjon og utredning</h2>

<h2>Behandling</h2>

<h3>Lyskeglandler</h3>

<h2>Rehabilitering</h2>
<p>Sterkt fokus på seksualfunksjon og kroppsbilde. Henvisning til sexolog anbefales sterkt, og partner/pårørendes behov for informasjon bør ivaretas aktivt.</p>

<div class="sources"><h4>Kilder</h4><ul>

CONTENT_MAP['bph'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Aldersrelatert forstørrelse av prostatas transisjonssone. Svært vanlig etter 50 år. Symptombildet (LUTS) og resturin/flowmetri styrer behandlingsvalg — ikke prostatastørrelse alene.</div>

<h2>Symptomer (LUTS)</h2>
<ul>
<li><strong>Lagringssymptomer:</strong> frequency, urgency, nokturi</li>
<li><strong>Tømmingssymptomer:</strong> svak stråle, hesitasjon, avbrutt stråle, følelse av ufullstendig tømming, etterdrypp</li>
</ul>

<h2>Utredning</h2>
<p>Anamnese med symptomskår (IPSS), klinisk undersøkelse inkl. DRE, urinstiks, flowmetri med resturinmåling. PSA diskuteres med pasienten på samme grunnlag som ved screening for øvrig. Ultralyd nyre/blære vurderes ved høyt resturin, hematuri eller nedsatt nyrefunksjon.</p>

<h2>Komplikasjoner ved ubehandlet/progredierende sykdom</h2>
<p>Akutt urinretensjon, residiverende UVI, blærestein, og i sjeldne tilfeller nyresvikt sekundært til kronisk høytrykksretensjon.</p>

<h2>Behandling</h2>
<h3>Medikamentell</h3>
<ul>
<li><strong>Alfablokkere</strong> (tamsulosin, alfuzosin) — rask symptomlindring via avslapning av glatt muskulatur</li>
<li><strong>5-alfareduktasehemmere</strong> (finasterid, dutasterid) — reduserer prostatavolum over måneder, reduserer risiko for retensjon/kirurgi ved stort volum</li>
<li>Kombinasjonsbehandling ved stort volum og moderate–alvorlige symptomer</li>
<li>Beta-3-agonist/antikolinergika ved uttalt lagringskomponent, forutsatt lavt resturin</li>
</ul>
<h3>Kirurgisk</h3>
<p>Indisert ved refraktære symptomer på medikamenter, residiverende retensjon/UVI/hematuri, blæresten, eller obstruktiv nyresvikt. TURP er gullstandard ved moderate prostatavolum (se Operasjonsteknikker). Laserenukleasjon (HoLEP) og robotassistert enukleasjon er alternativer ved større volum. Minimalinvasive teknikker (f.eks. UroLift) kan være aktuelle hos selekterte pasienter som ønsker å bevare ejakulasjonsfunksjon.</p>

<h2>Ahus intern retningslinje — henvisning og kirurgisk utfallsvurdering</h2>
<div class="callout internal"><b>Ahus internt — urologisk poliklinikk</b>Lokal prosedyre for henvisning ved obstruktiv mannlig LUTS/BPH (internt undervisningsmateriale, sist endret sept. 2024). Ikke en nasjonal retningslinje.</div>

<h3>Avvisningskriterier ved henvisning</h3>
<p>Henvisninger for obstruktiv mannlig LUTS avvises dersom medikamentell behandling ikke er forsøkt. Fastlege anbefales å forsøke alfablokker som førstevalg, og legge til 5-alfareduktasehemmer hvis prostata kjennes forstørret uten tumormistanke ved DRE. Rehenvisning er aktuelt ved manglende effekt av medikamentell behandling, eller uakseptable bivirkninger, dersom pasienten er motivert for kirurgisk behandling (TURP/enukleasjon).</p>
<p>Ved rehenvisning ønskes minimum: tidligere sykdommer, faste medisiner, høyde/vekt, utfylt IPSS-skjema og drikke-/miksjonsliste, samt funn ved rektaleksplorasjon.</p>

<h3>Forventet utfall av kirurgi mot utløpsobstruksjon</h3>
<p>Ahus bruker en strukturert baseline-vurdering (basert på internasjonal LUTS-litteratur) for å anslå sannsynlig gevinst av kirurgi mot utløpsobstruksjon:</p>
<div class="riskgrid cols-2">
<div class="riskcard low"><h4>Gunstige faktorer</h4><ul>
<li>Plagsomme tømmingssymptomer (høy ICIQ-MLUTS voiding-subskår)</li>
<li>Lav flow på flowmetri (korrigert Qmax &lt;10 mL/s)</li>
<li>Høy symptombyrde (IPSS &gt;16)</li>
<li>Dårlig livskvalitet pga. LUTS (IPSS QoL &gt;4)</li>
<li>Alder &lt;74 år, lav komorbiditet</li>
</ul><p style="margin-top:8px"><strong>Alle 5 til stede</strong> → sannsynlig symptombedring av kirurgi</p></div>
<div class="riskcard high"><h4>Ugunstige faktorer</h4><ul>
<li>Tømmingssymptomer som ikke påvirker livskvalitet</li>
<li>Moderat/god flow (korrigert Qmax ≥13 mL/s)</li>
<li>Symptomer med kjent dårlig responsrate (nokturi, inkontinens, postmiksjonsdrypp)</li>
<li>Utbredt komorbiditet</li>
</ul><p style="margin-top:8px"><strong>Én eller flere til stede</strong> → nøytral effekt eller risiko for forverring</p></div>
</div>
<p>Ved uklart bilde er <strong>urodynamikk</strong> nyttig for å skille reell obstruksjon (høy blæreutløpsobstruksjonsindeks/-kontraktilitetsindeks) fra uobstruert eller underaktiv detrusor — noe som direkte påvirker forventet nytte av kirurgisk avlastning.</p>

<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Management of Non-neurogenic Male LUTS, uroweb.org</li>
<li><strong>Ahus urologisk poliklinikk</strong> — internt undervisningsmateriale «LUTS og bekkensmerter, ark til leger» (lokal prosedyre, sist endret sept. 2024)</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Sjekk alltid gjeldende Ahus-prosedyre.</div>
`};

CONTENT_MAP['nyrestein'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Livstidsrisiko for nyrestein er 10–15 %, med høy residivrisiko uten forebygging. Feber + obstruerende stein er en urologisk akuttsituasjon som krever rask avlastning. Ca. 85 % er idiopatisk kalsiumurolithiasis — de resterende ca. 15 % har en identifiserbar MIAF-årsak (se under) som krever målrettet utredning og behandling.</div>

<h2>Steintyper</h2>
<p>Kalsiumoksalat/kalsiumfosfat er vanligst (ca. 80 %). Andre: urinsyre (radiolucent på vanlig røntgen, men synlig på CT), struvitt/infeksjonsstein (assosiert med ureasesproduserende bakterier), og cystin (arvelig).</p>

<h2>Akutt presentasjon og utredning</h2>
<p>Klassisk bilde er akutt flankesmerte (nyrekolikk) med kvalme, ofte uten feber. <strong>CT urinveier uten kontrast</strong> er gullstandard for diagnostikk. Ultralyd er førstevalg hos gravide og barn. Urinstiks tas rutinemessig for å avdekke samtidig infeksjon.</p>
<div class="callout high"><b>Akutt varsel</b>Feber + obstruerende stein = urosepsis-risiko. Krever akutt avlastning (JJ-stent eller perkutan nefrostomi) — ikke vent til steinen kan fjernes definitivt.</div>

<h2>Innleggelseskriterier</h2>
<p>Følgende bør vurderes for akutt innleggelse: manglende analgetisk effekt av primærbehandling, ledsagende feber (&gt;38,5 °C), underliggende nyresykdom, eller tidlig residiv av steinanfall. Ukomplisert urolithiasis kan henvises til elektiv CT-urografi innen 3–4 uker fra fastlege/legevakt, med kopi til fastlege og parallell henvisning til urologisk poliklinikk for vurdering etter CT.</p>

<h2>Akutt behandling</h2>
<p>Smertestillende — NSAID er førstevalg der ikke kontraindisert. Medikamentell ekspulsjonsterapi (alfablokker) kan fremme spontan avgang av distale ureterstein &lt;10 mm. Akutt avlastning er indisert ved infeksjon, komplett obstruksjon med nedsatt nyrefunksjon, eller obstruksjon av solitær/transplantert nyre.</p>

<h2>Definitiv steinbehandling</h2>
<p>Valg av metode avhenger av steinstørrelse, -lokalisasjon og -sammensetning: ESWL (ekstrakorporal støtbølgelitotripsi), ureterorenoskopi/RIRS, eller PCNL ved store steinbyrder (se Operasjonsteknikker for detaljer om de endoskopiske metodene). Blærestein behandles med cystolitotripsi (se Operasjonsteknikker).</p>
<p>Ikke alle konkrementer trenger aktiv behandling: asymptomatiske nyrebekkenkonkrementer man forventer passerer spontant (&lt;5 mm) og konkrementer i nedre calyx &lt;1–1,5 cm kan følges. Steindannere med restkonkrementer som bevisst ikke behandles, bør kontrolleres med CT etter 1–3 år.</p>

<h2>MIAF-klassifikasjon</h2>
<p>Steindannere deles i to hovedgrupper:</p>
<div class="riskgrid" style="grid-template-columns:1fr 1fr;">
<div class="riskcard low"><h4>Idiopatisk kalsiumurolithiasis (~85 %)</h4><p>Ingen enkeltstående årsak — skyldes en kombinasjon av økt urin-supersaturasjon, lav døgndiurese, kostfaktorer og redusert mengde naturlige krystallisasjonshemmere i urinen (særlig citrat).</p></div>
<div class="riskcard high"><h4>MIAF-urolithiasis (~15 %)</h4><p><strong>M</strong>etabolisk (f.eks. hyperparatyreoidisme, enterisk hyperoksaluri), <strong>I</strong>nfeksiøs (struvittstein), <strong>A</strong>natomisk (f.eks. avløpshinder, hesteskonyre) eller <strong>F</strong>unksjonell årsak til steindannelse — krever målrettet utredning og spesifikk behandling av underliggende årsak.</p></div>
</div>

<h2>Metabolsk utredning — tre nivåer</h2>
<p>Utredningsdybden trappes opp etter kompleksitet og residivmønster:</p>
<table class="datatable">
<tr><th>Nivå</th><th>Indikasjon</th><th>Innhold</th></tr>
<tr><td class="mono">Basal</td><td>Alle pasienter</td><td>S-kreatinin, S-ionisert kalsium, S-urat; urinstiks/-dyrkning; steinanalyse når mulig</td></tr>
<tr><td class="mono">Utvidet</td><td>Komplisert idiopatisk kalsiumurolithiasis</td><td>Døgnurin: kalsium, citrat, volum</td></tr>
<tr><td class="mono">Selektiv</td><td>Mistanke om MIAF-årsak</td><td>Målrettet etter mistanke — f.eks. PTH, døgnurin-oksalat, døgnurin-/urinkvalitativ cystin, syre/base-status</td></tr>
</table>

<h2>Forebygging og profylakse</h2>
<h3>Generelle (ikke-farmakologiske) tiltak</h3>
<ul>
<li><strong>Væskeinntak</strong> — viktigste enkelttiltak. Mål er døgnurinvolum &gt;2–2,5 L, som reduserer metningsgraden av alle potensielt krystalldannende salter</li>
<li><strong>Moderat inntak av animalsk protein</strong> og salt-/kaloririk kost</li>
<li><strong>Ikke kalsiumrestriksjon</strong> — kontraintuitivt, men viktig: lavt kalsiuminntak er assosiert med <em>økt</em> steinrisiko (kalsium i kosten binder oksalat i tarmen og reduserer oksalatabsorpsjon), og kan i tillegg gi osteopeni. Generelle råd om redusert kalsiuminntak frarådes derfor</li>
</ul>
<h3>Farmakologisk profylakse (spesialistoppgave)</h3>
<ul>
<li><strong>Kaliumcitrat</strong> — ved hypocitraturi, residiverende idiopatisk kalsiumstein, urinsyrestein, cystinuri eller renal tubulær acidose. Virker ved å alkalisere urinen og øke citratutskillelsen, som kompleksbinder kalsium og reduserer overmetning</li>
<li><strong>Tiazid</strong> — ved idiopatisk hyperkalsiuri uten hyperkalsemi</li>
<li><strong>Allopurinol</strong> — ved urinsyrestein/hyperurikosuri</li>
<li>Farmakologisk profylakse er i praksis alltid en spesialistoppgave og forutsetter forutgående metabolsk utredning</li>
</ul>

<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Urolithiasis, uroweb.org</li>
<li>Metodebok.no — Urologi (HUS): Urolithiasis, Steinkirurgi — indikasjon for ulike behandlinger, Steinprofylakse</li>
<li>Nyresten.dk — Årsager (MIAF-klassifikasjon)</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Metodebok.no gjenspeiler praksis ved Haukeland universitetssjukehus — kan avvike fra lokal praksis andre steder.</div>
`};

<div class="callout"><b>Kjapt sammendrag</b>Overaktiv blære (OAB) er en klinisk diagnose basert på lagringssymptomer, satt etter at andre årsaker (infeksjon, tumor, blærestein) er utelukket.</div>

<h2>Definisjon</h2>
<p>Urgency (plutselig, vanskelig utsettbar vannlatingstrang), ofte med urgency-inkontinens, frequency og nokturi, uten påvist urinveisinfeksjon eller annen forklarende patologi.</p>

<h2>Utredning</h2>
<p>Anamnese, miksjonslister (3 døgn er standard), urinstiks for å utelukke infeksjon/hematuri, og resturinmåling. Urodynamisk undersøkelse er ikke rutine, men bør vurderes ved diagnostisk usikkerhet, manglende respons på behandling, eller før invasive tiltak.</p>

<h2>Behandling — trinnvis</h2>
<ol>
<li>Livsstilstiltak og blæretrening (væskejustering, planlagt vannlating)</li>
<li>Medikamentell: antikolinergika eller beta-3-agonist (mirabegron) — sistnevnte har gunstigere bivirkningsprofil hos eldre (mindre kognitiv/antikolinerg belastning)</li>
<li>Intravesikal botulinumtoksin-injeksjon ved medikamentrefraktær sykdom (se Operasjonsteknikker)</li>
<li>Sakral nervemodulasjon (SNM) eller perkutan tibialisnervestimulering (PTNS) ved fortsatt refraktær sykdom</li>
</ol>

<h3>Henvisningskrav og avvisningskriterier</h3>
<p>Henvisninger med mangelfulle opplysninger avvises. Pasienter som ikke har forsøkt medikamentell behandling tilbakehenvises til fastlege. Pasienter henvist med samtidig forhøyet PSA og vannlatingsplager skal <strong>ikke</strong> LUTS-utredes før PSA er utredet særskilt.</p>

CONTENT_MAP['fimose'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Fysiologisk fimose hos små gutter er normalt og løser seg som regel spontant — patologisk fimose hos voksne (arrdannelse/BXO) krever behandling.</div>

<h2>Fimose</h2>
<p>Fysiologisk (aldersrelatert, umoden adherens mellom forhud og glans) skilles fra patologisk fimose, som oftest skyldes arrdannelse etter gjentatte infeksjoner eller lichen sclerosus (balanitis xerotica obliterans, BXO) — en kronisk, arrdannende hudtilstand som gir hvitlig, fortykket, uelastisk forhudsåpning.</p>

<h2>Balanitt</h2>
<p>Inflammasjon i glans/forhud, ofte candida- eller bakterielt betinget. Assosiert med dårlig hygiene og diabetes mellitus — residiverende balanitt bør gi mistanke om udiagnostisert diabetes.</p>

<h2>Behandling</h2>
<p>Topikal steroidkrem er førstelinjebehandling ved patologisk fimose uten mistanke om BXO, og kan være tilstrekkelig hos en betydelig andel. Sirkumsisjon (se Operasjonsteknikker) er indisert ved refraktær fimose, BXO, residiverende balanitt eller residiverende parafimose.</p>

<div class="sources"><h4>Kilder</h4><ul><li>EAU Guidelines — Paediatric Urology (fimose hos barn), uroweb.org</li></ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk.</div>
`};

CONTENT_MAP['hydrocele'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Skrotal ultralyd er obligatorisk ved enhver skrotal hevelse for å utelukke underliggende testistumor før hydrocele/varikocele antas som eneste forklaring.</div>

<h2>Hydrocele</h2>
<p>Væskeansamling mellom tunica vaginalis' to blad. Hos barn er den ofte <strong>kommuniserende</strong> (persisterende processus vaginalis) og kan gå tilbake spontant første leveår. Hos voksne er non-kommuniserende hydrocele vanligst, og kan være idiopatisk eller sekundær til infeksjon, traume eller tumor.</p>

<h2>Varikocele</h2>
<p>Dilatasjon av pampiniforme venøse plexus. Venstre side dominerer sterkt pga. anatomisk vinkling av v. testicularis inn i v. renalis ("nøtteknekker"-fenomen). Assosiert med redusert fertilitet hos en andel av pasientene.</p>

<h2>Utredning</h2>
<p>Klinisk undersøkelse — transilluminasjon er klassisk for hydrocele. Skrotal ultralyd med Doppler er obligatorisk for å utelukke testistumor og for å karakterisere varikocele.</p>

<h2>Behandling</h2>
<p>Hydrocelectomi ved store eller symptomatiske hydroceler (se Operasjonsteknikker — Hydrocelectomi ad modum Winkelmann). Varikocelekirurgi (åpen, laparoskopisk eller radiologisk embolisering) vurderes ved symptomer, kosmetiske plager, eller som ledd i infertilitetsutredning/-behandling.</p>

<div class="sources"><h4>Kilder</h4><ul><li>EAU Guidelines — Sexual and Reproductive Health, uroweb.org</li></ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk.</div>
`};

CONTENT_MAP['epididymitt'] = {type:'simple', html: `
<div class="callout high"><b>Akutt skrotum — alltid utelukk torsjon først</b>Testistorsjon er en kirurgisk emergency. Ved høy klinisk mistanke skal eksplorasjon ikke forsinkes av bildediagnostikk.</div>

<h2>Differensialdiagnoser ved akutt skrotum</h2>
<ul>
<li><strong>Testistorsjon:</strong> akutt, ofte hos unge menn/gutter, kraftig smerte, høytstående/horisontalt liggende testikkel, fraværende kremasterrefleks</li>
<li><strong>Epididymitt:</strong> gradvis smerteutvikling over timer–dager</li>
<li><strong>Torkvert testishydatide (appendix testis):</strong> ofte hos prepubertale gutter, "blue dot sign"</li>
</ul>

<h2>Testistorsjon</h2>
<p>Kritisk tidsvindu — irreversibel iskemisk skade øker raskt etter 6 timer. Klinisk mistanke alene er nok til å indisere akutt skrotal eksplorasjon; ultralyd med Doppler kan støtte diagnosen, men skal aldri forsinke kirurgi ved høy mistanke. Ved bekreftet torsjon gjøres detorkvering og fiksasjon (orkidopeksi) av begge testikler — se Operasjonsteknikker.</p>

<h2>Epididymitt</h2>
<p>Vanligvis infeksiøs. Hos yngre, seksuelt aktive menn er klamydia/gonoré vanligste agens; hos eldre og etter urologisk instrumentering er E. coli og andre urinveispatogener hyppigst. Positiv Prehn's tegn (smertelindring ved elevasjon av skrotum) kan støtte diagnosen klinisk, men er ikke pålitelig alene. Behandles med målrettet antibiotika etter agens/eksponeringsanamnese.</p>

<div class="sources"><h4>Kilder</h4><ul><li>EAU Guidelines — Urological Infections; Paediatric Urology, uroweb.org</li></ul></div>

`};

CONTENT_MAP['nevrogen'] = {type:'simple', html: `
<div class="callout high"><b>Hovedmål</b>Ved nevrogen blære er hovedmålet å beskytte øvre urinveier (nyrefunksjon) — ikke nødvendigvis kontinens alene. Høytrykks lagringsfase er den største trusselen.</div>

<h2>Årsaker</h2>
<p>Ryggmargsskade, multippel sklerose, spina bifida, diabetisk nevropati, og iatrogent etter omfattende bekkenkirurgi (f.eks. rektumkirurgi, prolapskirurgi).</p>

<h2>Klassifisering</h2>
<p>Kan grovt deles i detrusor-overaktiv (ofte ved suprasakrale lesjoner, gjerne med samtidig sfinkterdyssynergi) versus detrusor-underaktiv/arefleksisk blære (ofte ved infrasakrale/perifere lesjoner). Mønsteret avgjør både symptombilde og risiko for øvre urinveis-skade.</p>

<h2>Utredning</h2>
<p>Urodynamisk undersøkelse er sentral for å karakterisere blæremønsteret og identifisere høytrykks lagringsfase (høyt detrusortrykk under fylning), som er hovedrisikofaktor for hydronefrose og nyresvikt over tid.</p>

<h2>Behandling</h2>
<ul>
<li><strong>Ren intermitterende kateterisering (RIK)</strong> er bærebjelken ved tømmingssvikt</li>
<li>Antikolinergika eller intravesikal botulinumtoksin ved detrusor-overaktivitet med høyt lagringstrykk — helt sentralt for å beskytte øvre urinveier</li>
<li>Regelmessig oppfølging av nyrefunksjon og øvre urinveier (ultralyd/blodprøver) gjennom hele forløpet</li>
</ul>

<div class="sources"><h4>Kilder</h4><ul><li>EAU Guidelines — Neuro-Urology, uroweb.org</li></ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk.</div>

CONTENT_MAP['urinrorsstriktur'] = {type:'simple', html: `
<div class="callout"><b>Kjapt sammendrag</b>Urinrørsstriktur behandles trinnvis: intern uretrotomi er førstevalg ved kort primærstriktur. Ved residiv vurderes medikamentavgivende ballongdilatasjon (Optilume) som mellomsteg før åpen uretraplastikk, forutsatt kort bulbær striktur.</div>

<h2>Etiologi</h2>
<p>Idiopatisk, iatrogen (etter transuretral kirurgi, langvarig/gjentatt kateterisering, stråling), traumatisk (bekkenfraktur, «straddle injury»), inflammatorisk (lichen sclerosus/BXO — særlig meatal/penil striktur), eller postinfeksiøs.</p>

<h2>Klassifikasjon</h2>
<p>Beskrives etter lokalisasjon (meatal, penil, bulbær, membranøs/sfinkternær, prostatisk) og lengde — begge avgjørende for valg av behandling. Bulbære strikturer er vanligst og har generelt best prognose ved endoskopisk/minimalinvasiv behandling.</p>

<h2>Utredning</h2>
<ul>
<li>Anamnese og flowmetri/resturin (karakteristisk platådannet flowkurve)</li>
<li>Retrograd uretrografi (± mikjsonsuretrografi) for lokalisasjon og lengde</li>
<li>Cystoskopi — vurderer om strikturen er passabel med guidewire, viktig for behandlingsvalg</li>
</ul>

<h2>Behandlingsstige</h2>
<ol class="steplist compact">
<li><strong>Intern uretrotomi</strong> — førstevalg ved kort primærstriktur (se Operasjonsteknikker)</li>
<li><strong>Ved residiv etter første uretrotomi:</strong> vurder <strong>Optilume</strong> (medikamentavgivende ballongdilatasjon) som alternativ til ny uretrotomi eller direkte henvisning til åpen kirurgi — forutsetter kort (&lt;3 cm) bulbær striktur, passabel med guidewire ved poliklinisk cystoskopi (se Operasjonsteknikker)</li>
<li><strong>Ved fortsatt residiv, lang/kompleks striktur, eller striktur uegnet for endoskopisk behandling:</strong> henvisning til åpen uretraplastikk</li>
</ol>

<div class="callout internal"><b>Ahus internt — urologisk poliklinikk</b>Etter residiv av urinrørsstriktur følgende første intern uretrotomi kan Optilume-behandling ved DKS Ski vurderes som alternativ til ny uretrotomi eller åpen uretraplastikk, forutsatt kort (&lt;3 cm) bulbær striktur som er passabel med guidewire ved poliklinisk cystoskopi.</div>

<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Urethral Strictures, uroweb.org</li>
<li><strong>Ahus urologisk poliklinikk</strong> — internt henvisnings-/forberedelsesnotat for Optilume-behandling</li>
</ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk. Sjekk alltid gjeldende lokal prosedyre.</div>
`};

detailed: `
<h2>Preoperativ vurdering</h2>
<div class="stepblock"><span class="stepnum">1</span><h3>Indikasjon og MDT</h3><div class="body"><p>Beslutning tas i MDT basert på risikogruppering. RALP er hovedvalg ved høyrisiko lokalisert sykdom, likeverdig alternativ ved intermediær risiko. Ved lokalavansert sykdom må pasienten informeres om høy sannsynlighet (~40 %) for postoperativ tilleggsbehandling.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Nervesparing</h3><div class="body"><p>Grad av nervesparing veies mot onkologisk risiko for positive render, basert på MR-funn, biopsilokalisasjon og preoperativ erektil funksjon.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Lymfeknutedisseksjon</h3><div class="body"><p>Utvidet bilateral bekken-lymfeknutedisseksjon vurderes ved forhøyet risiko for spredning (nomogrambasert), gir viktig stadieinformasjon.</p></div></div>
<h2>Operative steg</h2>
<div class="stepblock"><span class="stepnum">1</span><h3>Leiring og portplassering</h3><div class="body"><p>Steil Trendelenburg (20–25°), transperitoneal tilgang med 5–6 porter, pneumoperitoneum 12–15 mmHg.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Tilgang til Retzius' rom</h3><div class="body"><p>Preperitoneale rommet utvikles ned mot endopelvin fascie. Bakre (Montsouris) tilgang som alternativ, særlig etter tidligere hernieplastikk med mesh.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Endopelvin fascie og DVC</h3><div class="body"><p>Åpnes bilateralt for å eksponere apex. Dorsal venekompleks ligeres for tidlig blødningskontroll.</p></div></div>

<div class="stepblock"><span class="stepnum">9</span><h3>Vesikouretral anastomose</h3><div class="body"><p>Løpende dobbel-armert sutur (van Velthoven). Lekkasjetest før avslutning.</p></div></div>

<h2>Postoperativ oppfølging</h2>
<div class="stepblock"><span class="stepnum">1</span><h3>Kateter</h3><div class="body"><p>5–10 dager, cystografi ved usikker anastomose.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Komplikasjoner</h3><div class="body"><ul>

detailed: `
<div class="stepblock"><span class="stepnum">1</span><h3>Indikasjon og samtykke</h3><div class="body"><p>Obstruktiv LUTS til tross for medikamentell behandling, der pasienten er motivert for kirurgisk behandling. Pasienten informeres grundig om inngrepets art og mulige bivirkninger/komplikasjoner: retrograd ejakulasjon (svært vanlig), persisterende hematuri, infeksjon, behov for reTURP, sfinkterskade og mulig inkontinens.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Reseksjonsteknikk</h3><div class="body"><p>Systematisk reseksjon i kvadranter fra blærehals mot verumontanum (colliculus), med fortløpende hemostase av blødende kar for å bevare oversikt. Målet er en jevn kavitet hele veien ned til colliculus — viktig landemerke for å unngå sfinkterskade distalt.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Komplikasjoner</h3><div class="body"><ul>

<li>Sjeldnere: inkontinens, uretra-/blærehalsstriktur</li>
</ul>
<p class="footnote">Fotnote: TUR-syndrom (hyponatremi/væskeoverbelastning pga. absorpsjon av hypoton skyllevæske gjennom åpne vener i reseksjonssåret) er historisk en fryktet komplikasjon ved <strong>monopolar</strong> teknikk med glycinskylling. Ved bipolar teknikk med saltvannsskylling — som er standard ved Ahus — foreligger denne risikoen ikke, siden saltvann er isoton og ledende. Tatt med her kun som generell bakgrunnskunnskap, ikke som reell lokal risiko.</p>
</div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Postoperativt</h3><div class="body"><ul>
<li>Kontinuerlig blæreskylling til klar urin</li>
<li>Ikke indikasjon for rutinemessig tromboseprofylakse eller videre antibiotika ved ukomplisert forløp</li>
<li>Preparat sendes til histologisk undersøkelse</li>
<li>Kateter seponeres når urinen er klar, typisk dag 1–3</li>
<li>Kontroll med flow og resturinmåling på urologisk poliklinikk 3 måneder postoperativt</li>

<div class="callout" style="background:var(--card);border-left:3px solid var(--line-strong);font-size:13.5px;line-height:1.7;">

I narkose og med pasientens informerte samtykke utføres:<br>
<strong>KED22</strong> Transurethral reseksjon av prostata<br><br>
Trygg kirurgi. Xylocaingel. Visuell obturator til blære. Steil blærehals og prominent midtlapp som beskrevet i henvisning. Orienterende cystoskopi uten anmerkning, begge ostier visualiseres med urinjet. Anvender resektoskop og evaporisator for reseksjon på både midt- og sidelapper til muskelvev i dypet. Etterlater jevn og akseptabel kavitet hele veien ned til colliculus. Hemostase med evaporisator. Anlegger 3-veisskyll Ch 20. Akseptabel farge på urinsvar.<br><br>
<em>Umiddelbart forløp:</em> Ukomplisert.<br>

`};

<h3>Stenekstraksjon</h3>
<div class="callout" style="background:var(--card);border-left:3px solid var(--line-strong);font-size:13.5px;line-height:1.7;">
<b style="color:var(--ink-soft)">N20.1 Sten i urinleder</b>
Pasient med proksimal ureterstein påvist på CT, søkt inn til elektiv stensanering. Informert om inngrepets art, mulige komplikasjoner som blødning, infeksjon og skade på urinveier, samt forventet postoperativt forløp med stent. Samtykker.<br><br>
Med pasientens informerte samtykke, Bactrimprofylakse og i narkose utføres:<br>
<strong>KBE12</strong> Transluminal endoskopisk ekstraksjon av ureterstein<br>
<strong>KBV02</strong> Transurethral innleggelse av ureterstent<br><br>
Semi-rigid skop gjennom uretra til blære. Finner aktuelt ureterostium som entres med guidewire. Normalkalibrert ureter entres til man treffer fastsatt sten. Legger opp access sheath 10/12, bytter til fleksibelt skop. Skopi gjennom ureter til nyre. Gjør laserlitotripsi hvor konkrementet fragmenteres i flere biter som deretter ekstraheres med basket. Ser gjennom nyre og ureter uten funn av ytterligere sten. Tømmer blære via access sheath. Legger J-stent til øvre calyx under gjennomlysning, distale del krøller seg fint i blæren. Endoskopisk bedømt steinfri ved inngrepets slutt.<br><br>
<em>Videre:</em> J-stent med tråd, pasienten autoseponerer 5 dager postoperativt. Sten til analyse. CT-kontroll om 3 mnd. Informert om viktighet av drikkeprofylakse.

<div class="stepblock"><span class="stepnum">2</span><h3>Dosering og injeksjonsteknikk</h3><div class="body"><p>Injeksjonene settes supratrigonalt ved ikke-nevrogen/nevrogen OAB (reduserer refluksrisiko), men i selve trigonum ved PBS-indikasjon. Startdose er lavere hos ikke-nevrologiske (100 E/10 injeksjoner) enn nevrologiske pasienter (200 E/20 injeksjoner), som ofte har mer uttalt detrusoroveraktivitet.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Reinjeksjon og doseeskalering</h3><div class="body"><p>Reinjeksjon skjer på pasientens initiativ når effekten avtar, tidligst etter 3 måneder. Ved utilstrekkelig effekt økes dosen til 200 E, med 400 E som praktisk maksdose.</p></div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Samtidig botox på annen indikasjon</h3><div class="body"><p>Får pasienten samtidig botox på annen indikasjon (f.eks. migrene, spastisitet), bør blærebehandlingen gis samme døgn — ellers må man vente minst 3 måneder fra forrige dose, av hensyn til total toksinbelastning og antistoffrisiko.</p></div></div>
<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Non-neurogenic/Neurogenic LUTS, uroweb.org</li>
<li><strong>Ahus urologisk poliklinikk</strong> — internt undervisningsmateriale «LUTS og bekkensmerter, ark til leger» (lokal prosedyre, sist endret sept. 2024)</li>
</ul></div>
<div class="disclaimer">Erstatter ikke opplæring under supervisjon. Doser er lokal Ahus-praksis — sjekk alltid mot gjeldende lokal prosedyre.</div>
`};
