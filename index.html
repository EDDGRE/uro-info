detailed: `
<h2>Bakgrunn</h2>
<p>Optilume er en medikamentavgivende høytrykksballong (paklitaksel) som kombinerer mekanisk dilatasjon av strikturen med lokal antifibrotisk medikamentavgivelse, med mål om å redusere residivraten sammenlignet med ren uretrotomi/ballongdilatasjon uten medikament. Brukes som mellomsteg i behandlingsstigen — se Urinrørsstriktur.</p>
<div class="stepblock"><span class="stepnum">1</span><h3>Poliklinisk forberedelse</h3><div class="body"><p>Journalopptak avklarer residivstriktur, tidspunkt for forrige intern uretrotomi, vannlatingsplager, og om strikturen er passabel med guidewire ved poliklinisk cystoskopi — avgjørende for om benholdere/samtidig uretrotomi må planlegges. Rtg. uretragrafi kartlegger lokalisasjon og lengde. Pasienten informeres grundig om prosedyren, forventet forløp og risiko for hematuri, dysuri og residiv.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Grønnskjema</h3><div class="body"><ul>
<li>Operasjonskode: «U Optilume», behandlingssted Ski sykehus</li>
<li>Leie: ryggleie (med benholdere hvis ikke-passabel striktur med guidewire, mtp. intern uretrotomi forut for prosedyren)</li>
<li>Utstyr: fleksibelt engangsskop/Optilume-utstyr, ev. gjennomlysning</li>
<li>Antibiotikaprofylakse: 2 tabletter Bactrim</li>
</ul></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Klargjøring og skopi</h3><div class="body"><p>Optilume-systemet klargjøres og tømmes for luft før prosedyrestart. Engangscystoskopi føres gjennom normalkalibrert uretra frem til konsentrisk striktur i bulbære del.</p></div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Lokalisering og guidewire</h3><div class="body"><p>Strikturens beliggenhet og lengde bekreftes med kontrast og gjennomlysning. Guidewire føres forbi strikturen til blæren, med verifisering under gjennomlysning.</p></div></div>
<div class="stepblock"><span class="stepnum">5</span><h3>Predilatasjon</h3><div class="body"><p>Uretra blokkes trinnvis med uretrabougie Ch 8–12–16–20 før ballongen føres inn.</p></div></div>
<div class="stepblock"><span class="stepnum">6</span><h3>Ballongplassering og -inflasjon</h3><div class="body"><p>Optilume-ballongen føres over guidewiren og korrekt beliggenhet visualiseres — strikturen skal overlappes i begge ender, bekreftet både med engangscystoskop og gjennomlysning. Ballongen blåses opp til 10 atm i 7 minutter, deretter bekreftes tom ballong med gjennomlysning før seponering.</p></div></div>
<div class="stepblock"><span class="stepnum">7</span><h3>Avslutning</h3><div class="body"><p>Kateter Ch 14 legges over guidewire med 10 ml i ballongen. Urinsvar ved avslutning er typisk lyst blodig, forenlig med forventet postoperativt bilde.</p></div></div>
<div class="stepblock"><span class="stepnum">8</span><h3>Postoperativ instruks</h3><div class="body">
<ul>
<li>Kateter i 2 dager, pasienten instrueres i selvseponering før avreise</li>
<li>Rekontakt med helsevesenet ved infeksjonstegn</li>
<li>Kontroll med flow/resturin ca. 3 mnd på urologisk poliklinikk</li>
<li>Ingen seksuell aktivitet i 2 uker, beskyttet samleie, og ingen reproduksjon i 6 måneder (pga. paklitaksel på ballongen)</li>
</ul>
<div class="callout amber"><b>NB — avklar lokal instruks</b>Kildedokumentene angir noe ulik varighet for beskyttet samleie (8 uker i poliklinikkens forberedelsesnotat vs. 2 måneder i operasjonsnotatet). Avklar gjeldende instruks før pasienten informeres.</div>
</div></div>
<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Urethral Strictures, uroweb.org</li>
<li><strong>Ahus urologisk avdeling</strong> — internt henvisnings-/forberedelsesnotat og operasjonsnotat (KDH62 Transurethral rekanalisering av urethra, KUD02 Urethroskopi, ZTX0EJ/L01CD01 Optilume DCB medikamentgivende ballongblokking med paklitaksel)</li>
</ul></div>
<div class="disclaimer">Erstatter ikke opplæring under supervisjon på operasjonsstuen. Frasemal er lokal Ahus-praksis.</div>
`};

detailed: `
<div class="stepblock"><span class="stepnum">1</span><h3>Forberedelse og samtykke</h3><div class="body"><p>Pasienten informeres om inngrepets art og mulige bivirkninger/komplikasjoner: behov for kateter, infeksjon, hematuri, perioperativ skade på urinveier, samt mulighet for konvertering til åpen kirurgi eller manglende effekt på symptomer.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Tilgang</h3><div class="body"><p>Xylocaingel appliseres. Skop føres til blæren. Orienterende cystoskopi bekrefter tidligere beskrevet blæresten uten andre anmerkninger.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Steinknusing</h3><div class="body"><p>Steinen dustes og knuses trinnvis til mindre fragmenter med mekanisk litotriptor. Kraftigere/større steinbyrde kan supplere med energibasert system (f.eks. ShockPulse) ved behov.</p></div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Ekstraksjon</h3><div class="body"><p>Større fragmenter hentes ut manuelt. Mindre fragmenter fjernes med skylling (Ellik-evakuator). Blæren kontrolleres avslutningsvis for resterende konkrementer.</p></div></div>
<div class="stepblock"><span class="stepnum">5</span><h3>Avslutning</h3><div class="body"><p>3-veis skyllekateter (Ch 20) legges inn. Urinfargen bekreftes akseptabel før avslutning. Kompress- og instrumenttelling stemmer.</p></div></div>
<div class="stepblock"><span class="stepnum">6</span><h3>Postoperativt</h3><div class="body"><ul>
<li>Skylles etter urinfarge</li>
<li>Ikke indikasjon for rutinemessig tromboseprofylakse eller videre antibiotika ved ukomplisert forløp</li>
<li>Steinfragment sendes til dyrkning og steinanalyse</li>
<li>Kateter seponeres når urinen er klar — pasienten kan reise samme dag hvis ønskelig</li>
<li>Anbefalt kontroll av steinbyrde hos fastlege om 2 år, med henvisning til sanering ved vekst</li>
</ul></div></div>
<div class="sources"><h4>Kilder</h4><ul>
<li>EAU Guidelines — Urolithiasis, uroweb.org</li>
<li><strong>Ahus urologisk avdeling</strong> — internt operasjonsnotat/frasemal (KCE02 Transurethral ekstraksjon av blærestein)</li>

`};

<div class="stepblock"><span class="stepnum">1</span><h3>Preoperativ bekreftelse</h3><div class="body"><p>Ved klinisk undersøkelse på operasjonsdagen bekreftes funnene fra poliklinisk vurdering/ultralyd. Pasienten informeres grundig om inngrepets art, vanlig postoperativt forløp og mulige komplikasjoner — hematocele forekommer hos opptil en tredjedel, i tillegg til blødning, infeksjon og residiv.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Tilgang</h3><div class="body"><p>Horisontalt snitt over skrotum ventralt, skarpt gjennom raphe. Saks og diatermi brukes gjennom lagene ned til hydrocelesekken, med fortløpende hemostase.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Frigjøring av hydrocelesekken</h3><div class="body"><p>Hydrocelesekken frigjøres stumpt fra skrotum, tas ut og frigjøres ytterligere. Punkteres for å tømme innholdet (typisk stråblig, klar væske).</p></div></div>

<li>Ingen rutinemessig kontroll avtalt</li>
<li>Ved økende skrotal hevelse: oppsøke helsevesenet for vurdering (mistanke om hematocele/infeksjon)</li>

<div class="sources"><h4>Kilder</h4><ul>

detailed: `
<div class="stepblock"><span class="stepnum">1</span><h3>Forutgående utredning</h3><div class="body"><p>Skrotal UL har vist malignitetssuspekt tumor. Tumormarkører (hCG, AFP, LD) er tatt før operasjon — avgjørende for senere stadieinndeling og responsvurdering. CT thorax/abdomen/bekken har ikke vist tegn til metastaser. Pasienten har fått tilbud om og gjennomført sædbanking før inngrepet.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Klinisk undersøkelse</h3><div class="body"><p>Begge testikler palperes ved inspeksjon — den affiserte siden viser typisk en øm, palpabel, hard kul i testikkelen, mens kontralateral side er upåfallende.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Samtykke</h3><div class="body"><p>Pasienten informeres om inngrepet, inkludert risiko for blødning og infeksjon, samt muligheten for testisprotese — noe pasienten kan takke ja eller nei til.</p></div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Tilgang</h3><div class="body"><p><strong>Inguinal tilgang er obligatorisk</strong> — aldri transskrotal biopsi/kirurgi, da dette gir risiko for endret lymfedrenasje og lokal tumorspredning (se Testikkelkreft). Snitt gjennom hud i lysken, disseksjon ned gjennom subcutis, med ligering av vener ved behov.</p></div></div>
<div class="stepblock"><span class="stepnum">5</span><h3>Fridissekering og fjerning</h3><div class="body"><p>Gjennom fascien ned til funikkelen, som løftes opp og klemmes av med peang før videre disseksjon — dette hindrer tumorspredning via manipulasjon. Testis trekkes opp til lysken. Gubernaculum deles og ligeres. Funikkelen omstikkes to ganger og deles distalt for dette, med kontroll for at det ikke er blødning fra stumpen.</p></div></div>
<div class="stepblock"><span class="stepnum">6</span><h3>Lukking</h3><div class="body"><p>Fascien sutureres fortløpende (Novosyn 3-0), subcutis med enkeltstående suturer (Novosyn 3-0), og avsluttes med intrakutan sutur (Monosyn 4-0). Lokal infiltrasjonsanestesi (Marcain 5 mg/mL uten adrenalin) suppleres i sårområdet.</p></div></div>
<div class="stepblock"><span class="stepnum">7</span><h3>Postoperativt og videre forløp</h3><div class="body"><ul>
<li>Ingen suturfjerning nødvendig</li>
<li>Telefonkonsultasjon avtales for histologisvar (typisk ca. 2 uker)</li>
<li>Nye tumormarkører kontrolleres postoperativt (typisk etter 1 uke) — viktig for stadieinndeling</li>
<li>Henvises onkologisk behandling for videre stadieinndeling og behandling</li>
<li>Preparatet sendes til histologisk undersøkelse, svar ettersendes</li>
</ul></div></div>

detailed: `
<div class="stepblock"><span class="stepnum">1</span><h3>Klinisk vurdering</h3><div class="body"><p>Akutt ensidig skrotal smerte, ofte med kvalme/oppkast, gir klinisk mistanke om testistorsjon. Pasient (og foresatte ved mindreårig) informeres grundig om inngrepets art — sannsynlig detorkvering og fiksering av testis bilateralt — samt komplikasjoner som hematocele, infeksjon, og risiko for fjerning av testikkelen dersom den viser seg avital.</p></div></div>
<div class="stepblock"><span class="stepnum">2</span><h3>Eksplorasjon av affisert side</h3><div class="body"><p>Skarpt snitt gjennom skrotalhud over affisert testikkel. Saks og diatermi ned til kapsel. Torkvert testikkel er typisk blålig og luksérs ut, detorkveres, og legges i vått kompress mens man observerer reperfusjon/fargeendring.</p></div></div>
<div class="stepblock"><span class="stepnum">3</span><h3>Kontralateral eksplorasjon</h3><div class="body"><p>Tilsvarende skarpt snitt gjøres over kontralateral testikkel, som luksérs ut for inspeksjon (normalt utseende forventes). Hemostase sikres med diatermi bilateralt i skrotalsekken.</p></div></div>
<div class="stepblock"><span class="stepnum">4</span><h3>Fiksasjon</h3><div class="body"><p>Kontralateral (uaffisert) testikkel fikseres først, medialt og lateralt med resorberbar sutur (Novosyn 3-0), og tunica vaginalis lukkes fortløpende. Deretter fjernes kompresset fra den detorkverte testikkelen — ved normal farge vurderes den vital, orienteres i riktig leie, og fikseres på samme måte medialt og lateralt.</p></div></div>
<div class="stepblock"><span class="stepnum">5</span><h3>Lukking</h3><div class="body"><p>Tunica vaginalis lukkes fortløpende med resorberbar sutur på begge sider. Skrotalhud lukkes med enkeltstående suturer bilateralt.</p></div></div>
<div class="stepblock"><span class="stepnum">6</span><h3>Postoperativt</h3><div class="body"><ul>
<li>Ingen suturfjerning, ingen rutinemessig kontroll</li>
<li>Ingen hard fysisk aktivitet i 3 uker</li>
<li>Paracetamol og ibuprofen for smerter</li>

</ul></div></div>
<div class="callout"><b>Tidsvindu</b>Sjansen for testikkelviabilitet faller raskt med tid fra symptomdebut — irreversibel iskemisk skade øker betydelig etter ca. 6 timer, men testikler kan være vitale også noe lenger, som i eksempelet her (~4 timer).</div>

CONTENT_MAP['urinretensjon-akutt'] = {type:'simple', html: `
<div class="callout high"><b>Akutt håndtering</b>Umiddelbar avlastning med kateter er alltid førstetiltak — utredning av årsak kan vente.</div>

<h2>Årsaker</h2>
<p>BPH er vanligste årsak hos menn. Andre: postoperativ retensjon (etter anestesi/kirurgi, spesielt bekkenkirurgi), medikamenter (antikolinergika, opioider, alfaagonister), obstipasjon, akutt prostatitt/UVI, urinrørsstriktur, blæretamponade (se egen side), nevrogene årsaker, og postpartum-retensjon hos kvinner.</p>

<h2>Håndtering</h2>
<ol>
<li>Umiddelbar transuretral kateterisering. Ved vanskelig/mislykket kateterisering — mistenk striktur/via falsa (se egen side); ikke bruk kraft, tilkall urolog</li>
<li>Noter tappet volum. Ved &gt;1000 mL: økt risiko for postobstruktiv diurese — følg væskebalanse og elektrolytter de neste døgnene</li>
<li>Vurder årsak: DRE, anamnese på medikamenter/kirurgi, urinstiks</li>
<li>Alfablokker oppstartes ofte før forsøk på fjerning av kateter — bedrer sjansen for vellykket spontan vannlating («trial without catheter», TWOC)</li>
</ol>

<h2>Videre oppfølging</h2>
<p>Ved gjentatt retensjon eller mislykket TWOC henvises urologisk poliklinikk for utredning av underliggende obstruksjon og vurdering av definitiv behandling (se BPH og TURP).</p>

<div class="sources"><h4>Kilder</h4><ul><li>EAU Guidelines — Management of Non-neurogenic Male LUTS, uroweb.org</li></ul></div>
<div class="disclaimer">Kun til bruk som internt faglig oppslagsverk.</div>
`};

<h2>Årsaker (ischemisk)</h2>
<p>Idiopatisk, sigdcelleanemi, intrakavernøs injeksjonsbehandling for ereksjonssvikt, enkelte medikamenter (antipsykotika, antikoagulantia), og maligne infiltrasjoner.</p>

<h2>Diagnostikk</h2>
<p>Blodgassanalyse fra corpus cavernosum skiller typene: ischemisk gir lav pO2/høy pCO2/acidose (venøst preget), non-ischemisk gir arterielt preget blodgass. Doppler-ultralyd kan supplere.</p>

CONTENT_MAP['penisfraktur'] = {type:'simple', html: `
<div class="callout high"><b>Akutt kirurgisk tilstand</b>Akutt eksplorasjon og sutur (helst innen 24t) gir bedre resultat enn konservativ behandling.</div>

<h2>Presentasjon</h2>
<p>Ruptur av tunica albuginea under ereksjon, oftest ved samleie. Klassisk anamnese: hørbar «snap»/knekklyd, umiddelbar smerte og detumescens, raskt tiltagende hematom («aubergine sign» — penis blir mørk, hoven og bøyd mot den skadde siden).</p>

<h2>Behandling</h2>

<p>Erektil dysfunksjon, penil krumning (Peyronie-lignende deformitet — se Penisplastikk), og fisteldannelse.</p>

/* ============================================================
   RENDERING
   ============================================================ */

let currentId = 'home';

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = '';
  CATEGORIES.forEach(cat=>{
    const items = TOPICS.filter(t=>t.cat===cat.id);
    if(!items.length) return;
    html += `<h3 class="groupname"><span class="swatch ${cat.swatch}"></span>${cat.label}</h3><ul class="navlist">`;
    items.forEach(t=>{
      const activeClass = (t.id===currentId) ? 'active' : '';
      if(t.status==='ferdig'){
        html += `<li><a href="#" class="${activeClass}" onclick="navigate('${t.id}');return false;">${t.title}</a></li>`;
      } else {
        html += `<li><a href="#" class="disabled">${t.title} <span class="pill">planlagt</span></a></li>`;
      }
    });
    html += `</ul>`;
  });
  sb.innerHTML = html;
}

function renderHome(){
  const done = TOPICS.filter(t=>t.status==='ferdig' && t.cat!=='om');
  let cards = done.map(t=>{
    const clsMap = {benigne:'', maligne:'malign', kirurgi:'kirurgi'};
    return `<div class="home-card ${clsMap[t.cat]}">
      <h3>${t.title}</h3>
      <p>${TAGLABEL[t.cat]} — fullt utbygd oppslag med kilder fra Helsedirektoratet${t.cat==='kirurgi' || t.id==='peniskreft' ? ' og EAU' : ''}.</p>
      <a href="#" onclick="navigate('${t.id}');return false;">Åpne oppslag →</a>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="home-hero">
      <h1>Klinisk oppslagsverk for urologi</h1>
      <p>Bygget for leger i spesialisering i Norge. Rask oppslag på benigne og maligne tilstander, behandlingsvalg og operasjonsteknikk — basert på Helsedirektoratets retningslinjer, supplert med EAU Guidelines der det er relevant.</p>
    </div>
    <h2 style="border:none;margin-top:0;">Alle oppslag</h2>
    <div class="home-grid">${cards}</div>
  `;
}

function renderTopic(topic){
  const main = document.getElementById('main');
  const data = CONTENT_MAP[topic.id];
  let bodyHtml = '';

  if(!data){
    bodyHtml = `<div class="placeholder"><div class="icon">🚧</div><p>Dette oppslaget er ikke bygget ut ennå.</p></div>`;
  } else if(data.type === 'toggle'){
    bodyHtml = (data.intro||'') + `
      <div class="viewtoggle">
        <button id="btnKort" class="active" onclick="setView('kort')">KORT (sjekkliste)</button>
        <button id="btnDetalj" onclick="setView('detaljert')">DETALJERT</button>
      </div>
      <div id="viewKort" class="viewpane active">${data.short}</div>
      <div id="viewDetaljert" class="viewpane">${data.detailed}</div>
    `;
  } else {
    bodyHtml = (data.intro||'') + data.html;
  }

  const catLabel = CATEGORIES.find(c=>c.id===topic.cat).label;

  main.innerHTML = `
    <div class="crumb"><a href="#" onclick="navigate('home');return false;">UroOppslag</a> / ${catLabel}</div>
    <h1 class="pagetitle">${topic.title}</h1>
    <div class="tagrow">
      <span class="tag ${TAGCLASS[topic.cat] || ''}">${TAGLABEL[topic.cat] || ''}</span>
      ${topic.icd ? `<span class="tag tag-code">ICD-10: ${topic.icd}</span>` : ''}
      ${topic.ncsp ? `<span class="tag tag-code">NCSP: ${topic.ncsp}</span>` : ''}
    </div>
    <div class="content">${bodyHtml}</div>
  `;
}

function setView(view){
  const kort = document.getElementById('viewKort');
  const detalj = document.getElementById('viewDetaljert');
  const btnKort = document.getElementById('btnKort');
  const btnDetalj = document.getElementById('btnDetalj');
  if(view==='kort'){
    kort.classList.add('active'); detalj.classList.remove('active');
    btnKort.classList.add('active'); btnDetalj.classList.remove('active');
  } else {
    detalj.classList.add('active'); kort.classList.remove('active');
    btnDetalj.classList.add('active'); btnKort.classList.remove('active');
  }
}

function navigate(id){
  currentId = id;
  closeSidebarMobile();
  if(id==='home'){
    renderHome();
  } else {
    const topic = TOPICS.find(t=>t.id===id);
    if(topic) renderTopic(topic);
  }
  renderSidebar();
  window.scrollTo({top:0, behavior:'instant'});
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('searchInput').value='';
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const matches = TOPICS.filter(t=> t.status==='ferdig' && t.title.toLowerCase().includes(q));
  if(!matches.length){
    box.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--ink-soft)">Ingen treff.</div>`;
  } else {
    box.innerHTML = matches.map(t=>`<a href="#" onclick="navigate('${t.id}');return false;">${t.title}<br><span class="cat">${CATEGORIES.find(c=>c.id===t.cat).label}</span></a>`).join('');
  }
  box.classList.add('show');
});
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.searchwrap')) document.getElementById('searchResults').classList.remove('show');
});

function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebarMobile);

renderSidebar();
renderHome();
</script>
</body>
</html>
